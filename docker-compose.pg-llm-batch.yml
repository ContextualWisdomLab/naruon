# Opt-in overlay for an OPTIONAL pg-llm-batch checkout (offline-dev only).
#
# This file is NOT part of the default naruon stack, and it is NOT the primary
# batch path. In production, batch-tolerant embeddings route through
# contextual-orchestrator (the routing / cost hub), which forwards to
# pg-llm-batch and records cost — naruon does not talk to a batch Postgres
# directly. This overlay only exists so a developer can run a local pg-llm-batch
# Postgres when the orchestrator is unavailable; the code gates that fallback
# behind "orchestrator unavailable" (see backend/services/batch_embedding_service.py).
#
# naruon runs fine without this file and without a local pg-llm-batch checkout:
# the batch embedding path degrades to the per-item embedding path when
# unconfigured.
#
# Prerequisites:
#   git clone https://github.com/ContextualWisdomLab/pg-llm-batch.git ../pg-llm-batch
#   # The checkout must provide docker/postgres/Dockerfile before `up`.
#
# Usage:
#   PG_LLM_BATCH_CHECKOUT=../pg-llm-batch \
#     docker compose -f docker-compose.yml -f docker-compose.pg-llm-batch.yml up
#
# Then seed per-tenant batch config in naruon's Fernet DB (tenant_configs) —
# never via os.getenv:
#   batch_embedding_enabled = true
#   batch_local_dsn         = postgresql://${PG_LLM_BATCH_POSTGRES_USER}:${PG_LLM_BATCH_POSTGRES_PASSWORD}@pg-llm-batch-postgres:5432/${PG_LLM_BATCH_POSTGRES_DB}
#   (batch_orchestrator_base_url / batch_orchestrator_token stay set for the
#    primary orchestrator path; batch_local_dsn only feeds the offline fallback.)

services:
  pg-llm-batch-postgres:
    # Reuses the component's pg_tiktoken + pg_cron + pgsql-http Postgres image.
    build:
      context: ${PG_LLM_BATCH_CHECKOUT:-../pg-llm-batch}
      dockerfile: docker/postgres/Dockerfile
      args:
        PG_MAJOR: "16"
        ENABLE_TIKTOKEN: "1"
    environment:
      POSTGRES_USER: ${PG_LLM_BATCH_POSTGRES_USER:?Set PG_LLM_BATCH_POSTGRES_USER for the optional batch overlay}
      POSTGRES_PASSWORD: ${PG_LLM_BATCH_POSTGRES_PASSWORD:?Set PG_LLM_BATCH_POSTGRES_PASSWORD for the optional batch overlay}
      POSTGRES_DB: ${PG_LLM_BATCH_POSTGRES_DB:-pgllm}
    ports:
      - "127.0.0.1:5442:5432"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" pg_isready -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT bool_and(is_ready) FROM pg_llm_batch_health_check()
           WHERE component IN ('database','pg_tiktoken','com_config')" | grep -q t
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - pg-llm-batch-data:/var/lib/postgresql/data

volumes:
  pg-llm-batch-data:
