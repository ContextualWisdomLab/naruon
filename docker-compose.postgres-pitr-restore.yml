# Point-in-time recovery (PITR) restore target, used together with
# docker-compose.postgres-ha.yml:
#
#   docker compose -p <project> \
#     -f docker-compose.postgres-ha.yml \
#     -f docker-compose.postgres-pitr-restore.yml up -d db-restore
#
# RECOVERY_TARGET_TIME must be exported before starting db-restore; see
# scripts/postgres_pitr_drill.sh for the full drill flow.
services:
  db-restore:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    image: pgvector/pgvector:pg16
    entrypoint:
      - "/bin/bash"
    command:
      - "-c"
      - |
        set -euo pipefail
        pg_data=/var/lib/postgresql/data
        if [ ! -s "$${pg_data}/PG_VERSION" ]; then
          echo "Materializing restore data directory from base backup."
          find "$${pg_data}" -mindepth 1 -delete
          cp -a /base_backup/. "$${pg_data}/"
          rm -f "$${pg_data}/postmaster.pid" "$${pg_data}/standby.signal"
          touch "$${pg_data}/recovery.signal"
          {
            printf "restore_command = 'cp /wal_archive/%%f %%p'\n"
            printf "recovery_target_time = '%s'\n" "$${RECOVERY_TARGET_TIME}"
            printf "recovery_target_action = 'promote'\n"
          } >> "$${pg_data}/postgresql.auto.conf"
          chown -R postgres:postgres "$${pg_data}"
          chmod 700 "$${pg_data}"
        fi
        exec gosu postgres postgres
    environment:
      - RECOVERY_TARGET_TIME=${RECOVERY_TARGET_TIME:-unset}
    ports:
      - "${POSTGRES_PITR_RESTORE_PORT:-55444}:5432"
    volumes:
      - wal_archive:/wal_archive:ro
      - base_backup:/base_backup:ro
      - restore_data:/var/lib/postgresql/data

volumes:
  wal_archive:
  base_backup:
  restore_data:
