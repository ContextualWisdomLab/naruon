  undici: 8.10.2

patchedDependencies:
  '@next/eslint-plugin-next@16.3.6': patches/@next__eslint-plugin-next@16.3.6.patch
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

  vite@8.1.4: patches/vite@8.1.4.patch
