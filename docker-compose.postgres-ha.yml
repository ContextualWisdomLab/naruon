services:
  db-primary:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    image: pgvector/pgvector:pg16
    # Prepare the WAL archive and base-backup volumes as root before the stock
    # entrypoint initializes the cluster and drops privileges to postgres.
    entrypoint:
      - "/bin/bash"
      - "-c"
      - 'set -e; mkdir -p /wal_archive /base_backup; chown -R postgres:postgres /wal_archive /base_backup; chmod 700 /wal_archive /base_backup; exec /usr/local/bin/docker-entrypoint.sh "$$@"'
      - "postgres-entrypoint-wrapper"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ai_email}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running Postgres HA Compose}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f"
    ports:
      - "${POSTGRES_HA_PRIMARY_PORT:-5432}:5432"
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
      - ./scripts/postgres-ha/init-primary-replication.sh:/docker-entrypoint-initdb.d/010-replication-hba.sh:ro
      - wal_archive:/wal_archive
      - base_backup:/base_backup

  db-replica:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ai_email}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running Postgres HA Compose}
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running Postgres HA Compose}
    command: >
      bash -c "
      until pg_isready -h db-primary -p 5432; do sleep 1; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        chown -R postgres:postgres /var/lib/postgresql/data;
        gosu postgres pg_basebackup -h db-primary -D /var/lib/postgresql/data -U ${POSTGRES_USER:-postgres} -vP -R -X stream -C -S replica_slot_1;
      fi;
      chown -R postgres:postgres /var/lib/postgresql/data;
      chmod 700 /var/lib/postgresql/data;
      exec gosu postgres postgres
      "
    ports:
      - "${POSTGRES_HA_REPLICA_PORT:-5433}:5432"
    depends_on:
      - db-primary
    volumes:
      - pgdata_replica:/var/lib/postgresql/data

volumes:
  pgdata_primary:
  pgdata_replica:
  wal_archive:
  base_backup:
