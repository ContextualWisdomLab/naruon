apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      # Image runs as the non-root `appuser` (Dockerfile `USER appuser`).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: ghcr.io/seongho-bae/ai_email_client-backend:REPLACE_ME_VERSION
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: database-url
        - name: AUTH_SESSION_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: auth-session-hmac-secret
        volumeMounts:
        # readOnlyRootFilesystem needs a writable temp dir: email import
        # extracts uploaded .zip/.mbox archives via tempfile (TMPDIR=/tmp).
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
