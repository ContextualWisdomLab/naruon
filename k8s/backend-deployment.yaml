apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-registry
      containers:
      - name: backend
        image: ghcr.io/contextualwisdomlab/ai_email_client-backend:REPLACE_ME_VERSION
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: backend-tmp
          mountPath: /tmp
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: database-url
        - name: AUTH_SESSION_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: auth-session-hmac-secret
      volumes:
      - name: backend-tmp
        emptyDir: {}
