apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-registry
      containers:
      - name: frontend
        image: ghcr.io/seongho-bae/ai_email_client-frontend:REPLACE_ME_VERSION
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_INTERNAL_URL
          value: http://backend:8000
        - name: ALLOW_DOCKER_BACKEND_INTERNAL_URL
          value: '1'
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: next-volume
          mountPath: /app/.next
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: next-volume
        emptyDir: {}
