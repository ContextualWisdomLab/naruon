apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      annotations:
        trivy.aquasecurity.github.io/ignore: KSV-0125
      labels:
        app: frontend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: frontend-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-registry
      containers:
      - name: frontend
        image: ghcr.io/seongho-bae/ai_email_client-frontend:REPLACE_ME_VERSION
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
          - name: BACKEND_INTERNAL_URL
            value: "http://backend:8000"
          - name: ALLOW_DOCKER_BACKEND_INTERNAL_URL
            value: "1"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: frontend-tmp
            mountPath: /tmp
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-pid
            mountPath: /var/run
