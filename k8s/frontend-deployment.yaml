apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-registry
      # Image runs as the non-root `node` user (frontend/Dockerfile `USER node`).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: ghcr.io/seongho-bae/ai_email_client-frontend:REPLACE_ME_VERSION
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
          - name: BACKEND_INTERNAL_URL
            value: "http://backend:8000"
          - name: ALLOW_DOCKER_BACKEND_INTERNAL_URL
            value: "1"
        volumeMounts:
        # readOnlyRootFilesystem needs writable paths for `next start`:
        # Next.js writes runtime caches under .next/cache (fetch/image cache),
        # and libraries may use /tmp. WORKDIR is /app (frontend/Dockerfile).
        - name: next-cache
          mountPath: /app/.next/cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: next-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
