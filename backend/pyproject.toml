[project]
name = "naruon-backend"
version = "0.14.4"
description = "Naruon FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "aiosmtplib==5.1.2",
  "aioimaplib==2.0.1",
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "greenlet==3.5.5",
  "asyncpg==0.31.0",
  "pgvector==0.5.0",
  "rankweave==0.1.0",
  "openai==3.3.1",
  "langchain-text-splitters==1.1.2",
  "tiktoken==0.14.0",
  "google-api-python-client==2.199.0",
  "google-auth-httplib2==0.4.1",
  "google-auth-oauthlib==1.4.0",
  "email-validator==2.3.0",
  "cryptography==50.0.0",
  "python-multipart==0.0.32",
  "prometheus-fastapi-instrumentator==8.1.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-exporter-otlp==1.44.0",
  "protobuf==7.36.0",
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "websockets==17.0.1",
  "PyJWT==2.13.0",
  "icalendar==7.3.0",
  "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
  "coverage==7.15.4",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.ruff.lint]
# Keep the existing CI lint contract explicit when Ruff expands its defaults;
# broader rule adoption belongs in a separately reviewed modernization change.
select = ["E4", "E7", "E9", "F"]
