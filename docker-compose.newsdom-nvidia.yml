# Opt-in Linux NVIDIA runtime; inherits the exact supplier pin and private network.
services:
  newsdom:
    platform: linux/amd64
    build:
      dockerfile: Dockerfile.nvidia
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import shutil,urllib.request,sys; sys.exit(0 if shutil.which('mineru') and urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
