name: S3 Storage Integration

on:
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "backend/api/document_storage.py"
      - "backend/api/object_storage_providers.py"
      - "backend/core/object_storage_config.py"
      - "backend/db/document_object_record.py"
      - "backend/db/object_storage_provider.py"
      - "backend/services/document_object_*.py"
      - "backend/services/s3_object_storage.py"
      - "backend/alembic/versions/0018_document_object_records.py"
      - "backend/alembic/versions/0019_object_storage_providers.py"
      - "backend/tests/integration/test_s3_postgres_integration.py"
      - ".github/workflows/s3-storage-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-storage-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-and-s3:
    name: PostgreSQL 16.14 and LocalStack S3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: naruon_integration
          POSTGRES_USER: naruon
          POSTGRES_PASSWORD: naruon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naruon -d naruon_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      localstack:
        image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3
          LS_LOG: warn
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl --fail http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install hash-locked backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r backend/requirements-hashes.txt

      - name: Run real PostgreSQL and S3 lifecycle with failure injection
        shell: bash
        env:
          DATABASE_URL: postgresql+asyncpg://naruon:naruon@127.0.0.1:5432/naruon_integration
          DISABLE_BACKGROUND_WORKERS: "1"
          NARUON_S3_INTEGRATION: "1"
          OBJECT_STORAGE_BACKEND: s3
          OBJECT_STORAGE_S3_ALLOWED_HOSTS: s3.us-east-1.localhost.localstack.cloud
          OBJECT_STORAGE_REQUEST_TIMEOUT_SECONDS: "5"
          ALLOWED_CORS_ORIGINS: http://localhost:3000
          PYTHONWARNINGS: error
        run: |
          export AUTH_SESSION_HMAC_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          cd backend
          python -m pytest -q tests/integration/test_s3_postgres_integration.py
