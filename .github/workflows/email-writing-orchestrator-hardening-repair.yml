name: Email Writing Orchestrator Hardening Repair

on:
  push:
    branches:
      - feat/llm-email-writing-orchestrator-task5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-writing-orchestrator-hardening-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error
  DISABLE_BACKGROUND_WORKERS: "1"

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/naruon'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Apply minimal production repair
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path("backend/services/contextual_orchestrator_client.py")
          client = client_path.read_text(encoding="utf-8")
          old_constants = """_MAX_MESSAGE_COUNT = 64
          _MAX_MESSAGE_CHARS = 200_000
          _MAX_TOTAL_MESSAGE_CHARS = 1_000_000
          _MAX_SAFE_INTEGER = 2**53 - 1
          """
          new_constants = """_MAX_MESSAGE_COUNT = 64
          _MAX_MESSAGE_CHARS = 200_000
          _MAX_TOTAL_MESSAGE_CHARS = 1_000_000
          _MAX_JSON_DEPTH = 32
          _MAX_JSON_NODES = 100_000
          _MAX_TRACE_STEPS = 64
          _MAX_SAFE_INTEGER = 2**53 - 1
          """
          if old_constants not in client:
              raise SystemExit("contextual orchestrator constant anchor changed")
          client = client.replace(old_constants, new_constants, 1)

          json_helper_anchor = """    return value


          class ContextualOrchestratorClient:
          """
          json_helper_replacement = """    return value


          def _validate_json_structure(value: Any) -> None:
              \"\"\"Reject response trees whose parsing work exceeds fixed limits.\"\"\"
              pending: list[tuple[Any, int]] = [(value, 1)]
              observed_nodes = 0
              while pending:
                  current, depth = pending.pop()
                  observed_nodes += 1
                  if depth > _MAX_JSON_DEPTH or observed_nodes > _MAX_JSON_NODES:
                      raise ContextualOrchestratorError(\"orchestrator_malformed_response\")
                  if isinstance(current, dict):
                      pending.extend((item, depth + 1) for item in current.values())
                  elif isinstance(current, list):
                      pending.extend((item, depth + 1) for item in current)
                  elif isinstance(current, str) and _contains_surrogate(current):
                      raise ContextualOrchestratorError(\"orchestrator_malformed_response\")


          class ContextualOrchestratorClient:
          """
          if json_helper_anchor not in client:
              raise SystemExit("JSON helper anchor changed")
          client = client.replace(json_helper_anchor, json_helper_replacement, 1)

          send_anchor = """                    completion = await self._send_once(
                              client,
                              endpoint.normalized_url + _CHAT_COMPLETIONS_PATH,
                              headers,
                              payload,
                          )
          """
          send_replacement = send_anchor + """                    if completion.mode != mode:
                              raise ContextualOrchestratorError(
                                  \"orchestrator_malformed_response\"
                              )
          """
          if send_anchor not in client:
              raise SystemExit("completion mode anchor changed")
          client = client.replace(send_anchor, send_replacement, 1)

          strict_json_anchor = """        if not isinstance(value, dict):
                      raise ContextualOrchestratorError(\"orchestrator_malformed_response\")
                  return value
          """
          strict_json_replacement = """        if not isinstance(value, dict):
                      raise ContextualOrchestratorError(\"orchestrator_malformed_response\")
                  _validate_json_structure(value)
                  return value
          """
          if strict_json_anchor not in client:
              raise SystemExit("strict JSON anchor changed")
          client = client.replace(strict_json_anchor, strict_json_replacement, 1)

          trace_anchor = """        if not isinstance(raw_trace, list):
                      raise ContextualOrchestratorError(\"orchestrator_malformed_response\")
          """
          trace_replacement = """        if not isinstance(raw_trace, list) or len(raw_trace) > _MAX_TRACE_STEPS:
                      raise ContextualOrchestratorError(\"orchestrator_malformed_response\")
          """
          if trace_anchor not in client:
              raise SystemExit("trace cardinality anchor changed")
          client = client.replace(trace_anchor, trace_replacement, 1)
          client_path.write_text(client, encoding="utf-8")

          port_path = Path("backend/services/email_writing_orchestrator_port.py")
          port = port_path.read_text(encoding="utf-8")
          method_start = port.index("    async def run_judge(")
          method_end = port.index("    async def aclose(", method_start)
          repaired_method = '''    async def run_judge(
              self,
              operation: Callable[P, R],
              *args: P.args,
              **kwargs: P.kwargs,
          ) -> R:
              """Run one synchronous Judge operation in the bounded worker lane."""
              self._assert_judge_lane_open()
              await self._judge_semaphore.acquire()
              try:
                  loop = asyncio.get_running_loop()
                  with self._state_lock:
                      if self._closed:
                          raise RuntimeError("judge_lane_closed")
                      future = loop.run_in_executor(
                          self._judge_executor,
                          lambda: operation(*args, **kwargs),
                      )
                  try:
                      return await asyncio.shield(future)
                  except asyncio.CancelledError:
                      try:
                          await asyncio.shield(future)
                      except Exception:
                          pass
                      raise
              finally:
                  self._judge_semaphore.release()

'''
          port = port[:method_start] + repaired_method + port[method_end:]
          port_path.write_text(port, encoding="utf-8")

          config_path = Path("backend/api/tenant_config.py")
          config = config_path.read_text(encoding="utf-8")
          import_anchor = """import logging
          from typing import Optional
          """
          import_replacement = """import logging
          from typing import Optional
          from urllib.parse import urlsplit
          """
          if import_anchor not in config:
              raise SystemExit("tenant config import anchor changed")
          config = config.replace(import_anchor, import_replacement, 1)
          url_anchor = """    return None if validated is None else validated.normalized_url
          """
          url_replacement = """    if validated is None:
                  return None
              parsed = urlsplit(validated.normalized_url)
              if (
                  parsed.scheme.lower() != \"https\"
                  or not parsed.hostname
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.query
                  or parsed.fragment
                  or parsed.path not in {\"\", \"/\"}
              ):
                  raise HTTPException(
                      status_code=400,
                      detail=_EMAIL_WRITING_ORCHESTRATOR_INVALID,
                  )
              return validated.normalized_url
          """
          if url_anchor not in config:
              raise SystemExit("tenant config URL anchor changed")
          config = config.replace(url_anchor, url_replacement, 1)
          config_path.write_text(config, encoding="utf-8")
          PY
      - name: Verify focused and contract tests
        run: |
          cd backend
          python -m pytest -q \
            tests/test_contextual_orchestrator_hardening.py \
            tests/test_contextual_orchestrator_client.py \
            tests/test_email_writing_orchestrator_scope.py \
            tests/test_email_writing_orchestrator_migration.py \
            tests/test_email_writing_orchestrator_config_api.py
      - name: Lint repaired source and tests
        run: |
          cd backend
          python -m ruff check \
            api/tenant_config.py \
            services/contextual_orchestrator_client.py \
            services/email_writing_orchestrator_port.py \
            tests/test_contextual_orchestrator_hardening.py \
            tests/test_contextual_orchestrator_client.py \
            tests/test_email_writing_orchestrator_scope.py \
            tests/test_email_writing_orchestrator_migration.py \
            tests/test_email_writing_orchestrator_config_api.py
      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/email-writing-orchestrator-hardening-repair.yml
          git diff --check
          git config user.name "CWL Email Writing Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/email-writing-orchestrator-hardening-repair.yml \
            backend/api/tenant_config.py \
            backend/services/contextual_orchestrator_client.py \
            backend/services/email_writing_orchestrator_port.py
          git commit -m "fix(email-writing): harden orchestration boundaries"
          git push origin HEAD:${GITHUB_REF_NAME}
