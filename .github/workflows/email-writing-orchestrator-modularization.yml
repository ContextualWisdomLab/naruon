name: Email Writing Orchestrator Modularization

on:
  push:
    branches:
      - feat/llm-email-writing-orchestrator-task5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-writing-orchestrator-modularization
  cancel-in-progress: true

jobs:
  modularize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Run test-first modularization
        run: python .github/scripts/modularize_email_writing_orchestrator.py
      - name: Retarget hardening tests to the dedicated API module
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_contextual_orchestrator_hardening.py")
          text = path.read_text(encoding="utf-8")
          old = "from api import tenant_config\n"
          new = (
              "from api import email_writing_orchestrator_config as tenant_config\n"
          )
          if text.count(old) != 1:
              raise SystemExit("hardening API import anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify orchestration contracts
        run: |
          cd backend
          python -m pytest -q \
            tests/test_email_writing_orchestrator_module_boundary.py \
            tests/test_contextual_orchestrator_hardening.py \
            tests/test_contextual_orchestrator_client.py \
            tests/test_email_writing_orchestrator_scope.py \
            tests/test_email_writing_orchestrator_migration.py \
            tests/test_email_writing_orchestrator_config_api.py
      - name: Lint modularized source and tests
        run: |
          cd backend
          python -m ruff check \
            api/email_writing_orchestrator_config.py \
            api/tenant_config.py \
            main.py \
            tests/test_contextual_orchestrator_hardening.py \
            tests/test_email_writing_orchestrator_module_boundary.py \
            tests/test_email_writing_orchestrator_config_api.py
      - name: Compile modularized source
        run: |
          python -m compileall -q \
            backend/api/email_writing_orchestrator_config.py \
            backend/api/tenant_config.py \
            backend/main.py
      - name: Commit verified modularization
        run: |
          set -euo pipefail
          rm .github/scripts/modularize_email_writing_orchestrator.py
          rm .github/workflows/email-writing-orchestrator-modularization.yml
          git diff --check
          git config user.name "CWL Email Writing Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/scripts/modularize_email_writing_orchestrator.py \
            .github/workflows/email-writing-orchestrator-modularization.yml \
            backend/api/email_writing_orchestrator_config.py \
            backend/api/tenant_config.py \
            backend/main.py \
            backend/tests/test_contextual_orchestrator_hardening.py \
            backend/tests/test_email_writing_orchestrator_module_boundary.py \
            backend/tests/test_email_writing_orchestrator_config_api.py
          git commit -m "refactor(email-writing): isolate orchestration configuration API"
          git push origin HEAD:feat/llm-email-writing-orchestrator-task5
