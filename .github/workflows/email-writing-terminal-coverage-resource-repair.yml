name: Email Writing Terminal Coverage Resource Repair

on:
  push:
    branches:
      - feat/llm-email-writing-orchestrator-task5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-writing-terminal-coverage-resource-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Dispose the migration rehearsal engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "backend/tests/"
              "test_email_writing_orchestrator_terminal_coverage.py"
          )
          text = path.read_text(encoding="utf-8")
          old = '''        assert not inspector.has_table(
              "email_writing_orchestrator_config"
          )
          assert inspector.has_table("unrelated_record")
          '''
          new = old + "    engine.dispose()\n"
          if text.count(old) != 1:
              raise SystemExit("migration cleanup anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify warning-free terminal suite
        run: |
          cd backend
          python -m pytest -q \
            tests/test_email_writing_orchestrator_terminal_coverage.py
          python -m ruff check \
            tests/test_email_writing_orchestrator_terminal_coverage.py
      - name: Commit verified resource cleanup
        run: |
          set -euo pipefail
          rm .github/workflows/email-writing-terminal-coverage-resource-repair.yml
          git diff --check
          git config user.name "CWL Email Writing Coverage Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/email-writing-terminal-coverage-resource-repair.yml \
            backend/tests/test_email_writing_orchestrator_terminal_coverage.py
          git commit -m "test(email-writing): close migration rehearsal resources"
          git push origin HEAD:feat/llm-email-writing-orchestrator-task5
