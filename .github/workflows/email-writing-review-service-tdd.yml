name: Email Writing Review Service TDD

on:
  push:
    branches:
      - feat/email-writing-review-service-task9-current-stack
  pull_request:
    paths:
      - backend/services/email_writing_review_service.py
      - backend/tests/test_email_writing_review_service.py
      - backend/tests/test_email_writing_review_service_execution.py
      - backend/tests/test_email_writing_review_service_review_regressions.py
      - scripts/ci/reject_terminal_output.sh
      - .github/workflows/email-writing-review-service-tdd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-writing-review-service-tdd-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error

jobs:
  task9-review-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - name: Initialize isolated test settings
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test_db\n"
              )
              env_file.write(
                  f"AUTH_SESSION_HMAC_SECRET={secrets.token_urlsafe(48)}\n"
              )
          PY
      - name: Install hash-locked application dependencies
        run: >-
          bash scripts/ci/reject_terminal_output.sh
          python -m pip install --disable-pip-version-check --require-hashes
          -r backend/requirements-hashes.txt
      - name: Install hash-verified coverage tool
        run: |
          set -euo pipefail
          mkdir -p /tmp/coverage-wheel
          cat >/tmp/coverage-lock.txt <<'EOF'
          coverage==7.15.2 --hash=sha256:eb6bcae8d1a9d305351ecb108232441d11c5cfe9de840a04388ba5d2db8d735c
          EOF
          bash scripts/ci/reject_terminal_output.sh \
            python -m pip download \
              --disable-pip-version-check \
              --require-hashes \
              --no-deps \
              --only-binary=:all: \
              --platform any \
              --python-version 3.14 \
              --implementation py \
              --abi none \
              --dest /tmp/coverage-wheel \
              -r /tmp/coverage-lock.txt
          bash scripts/ci/reject_terminal_output.sh \
            python -m pip install --disable-pip-version-check --no-deps \
              /tmp/coverage-wheel/coverage-7.15.2-py3-none-any.whl
      - name: Run Task 9 review service tests
        run: |
          cd backend
          bash ../scripts/ci/reject_terminal_output.sh \
            python -m pytest -q --noconftest \
              tests/test_email_writing_review_service.py \
              tests/test_email_writing_review_service_execution.py \
              tests/test_email_writing_review_service_review_regressions.py
      - name: Verify Task 9 statement and branch coverage
        run: |
          cd backend
          bash ../scripts/ci/reject_terminal_output.sh python -m coverage erase
          bash ../scripts/ci/reject_terminal_output.sh \
            python -m coverage run --branch \
              --include='services/email_writing_review_service.py' \
              -m pytest -q --noconftest \
                tests/test_email_writing_review_service.py \
                tests/test_email_writing_review_service_execution.py \
                tests/test_email_writing_review_service_review_regressions.py
          bash ../scripts/ci/reject_terminal_output.sh \
            python -m coverage report --show-missing --fail-under=100 \
              services/email_writing_review_service.py
      - name: Verify shipped Python docstrings
        run: |
          set -euo pipefail
          cat >/tmp/check_task9_docstrings.py <<'PY'
          import ast
          from pathlib import Path

          path = Path("services/email_writing_review_service.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          missing: list[str] = []
          if ast.get_docstring(tree) is None:
              missing.append(f"{path}:<module>")
          for node in ast.walk(tree):
              if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                  if ast.get_docstring(node) is None:
                      missing.append(f"{path}:{node.lineno}:{node.name}")
          if missing:
              raise SystemExit("Missing shipped docstrings:\n" + "\n".join(missing))
          print("Docstring gate passed for Task 9 review service")
          PY
          cd backend
          bash ../scripts/ci/reject_terminal_output.sh \
            python /tmp/check_task9_docstrings.py
      - name: Lint Task 9 source and tests
        run: |
          cd backend
          bash ../scripts/ci/reject_terminal_output.sh \
            python -m ruff check \
              services/email_writing_review_service.py \
              tests/test_email_writing_review_service.py \
              tests/test_email_writing_review_service_execution.py \
              tests/test_email_writing_review_service_review_regressions.py
      - name: Compile Task 9 source and tests
        run: |
          bash scripts/ci/reject_terminal_output.sh \
            python -m compileall -q \
              backend/services/email_writing_review_service.py \
              backend/tests/test_email_writing_review_service.py \
              backend/tests/test_email_writing_review_service_execution.py \
              backend/tests/test_email_writing_review_service_review_regressions.py
