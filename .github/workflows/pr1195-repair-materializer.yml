name: PR 1195 repair source-dedupe materializer

on:
  push:
    branches:
      - claude/contextualwisdomlab-audit-governance-qyxe67

permissions:
  contents: read

concurrency:
  group: pr-1195-repair-source-dedupe-materializer
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Repair the deterministic one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr-1195-fix-source-dedupe.yml")
          text = path.read_text(encoding="utf-8")

          old_assertion = (
              "          final_assertion = '    assert imported[0][\\\"subject\\\"] "
              "== \\\"POP3 import\\\"\\n'\n"
          )
          new_assertion = (
              "          final_assertion = '    assert imported[0][\\\"email_data\\\"]"
              "[\\\"subject\\\"] == \\\"POP3 import\\\"\\n'\n"
          )
          if text.count(old_assertion) != 1:
              raise RuntimeError(
                  "expected one obsolete POP3 assertion anchor, found "
                  f"{text.count(old_assertion)}"
              )
          text = text.replace(old_assertion, new_assertion, 1)

          commit_line = (
              '          git commit -m "fix(email): bind untrusted-date dedupe '
              'to raw source"\n'
          )
          self_delete = (
              "          git rm -- "
              ".github/workflows/pr-1195-fix-source-dedupe.yml\n"
              + commit_line
          )
          if text.count(commit_line) != 1:
              raise RuntimeError(
                  "expected one final commit line, found "
                  f"{text.count(commit_line)}"
              )
          text = text.replace(commit_line, self_delete, 1)
          path.write_text(text, encoding="utf-8")
          PY

          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/pr-1195-fix-source-dedupe.yml
          git diff --check

      - name: Publish repaired materializer and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr1195-repair-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-1195-fix-source-dedupe.yml
          git diff --cached --check
          git commit -m "fix(ci): repair PR 1195 source-dedupe materializer"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
