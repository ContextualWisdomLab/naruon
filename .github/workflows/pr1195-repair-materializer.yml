name: PR 1195 repair source-dedupe materializer

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1195-repair-source-dedupe-materializer
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'claude/contextualwisdomlab-audit-governance-qyxe67'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Repair the deterministic one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr-1195-fix-source-dedupe.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          assertion_indexes = [
              index
              for index, line in enumerate(lines)
              if "final_assertion =" in line and "POP3 import" in line
          ]
          if len(assertion_indexes) != 1:
              raise RuntimeError(
                  "expected one POP3 assertion definition, found "
                  f"{len(assertion_indexes)}"
              )
          assertion_index = assertion_indexes[0]
          assertion_indent = lines[assertion_index][
              : len(lines[assertion_index]) - len(lines[assertion_index].lstrip())
          ]
          assertion_value = (
              '    assert imported[0]["email_data"]["subject"] '
              '== "POP3 import"\n'
          )
          lines[assertion_index] = (
              f"{assertion_indent}final_assertion = {assertion_value!r}\n"
          )

          commit_command = (
              'git commit -m "fix(email): bind untrusted-date dedupe to raw source"'
          )
          commit_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip() == commit_command
          ]
          if len(commit_indexes) != 1:
              raise RuntimeError(
                  "expected one final commit command, found "
                  f"{len(commit_indexes)}"
              )
          commit_index = commit_indexes[0]
          commit_indent = lines[commit_index][
              : len(lines[commit_index]) - len(lines[commit_index].lstrip())
          ]
          self_delete = (
              f"{commit_indent}git rm -- "
              ".github/workflows/pr-1195-fix-source-dedupe.yml\n"
          )
          if commit_index == 0 or lines[commit_index - 1] != self_delete:
              lines.insert(commit_index, self_delete)

          path.write_text("".join(lines), encoding="utf-8")
          PY

          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/pr-1195-fix-source-dedupe.yml
          git diff --check

      - name: Publish repaired materializer and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr1195-repair-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-1195-fix-source-dedupe.yml
          git diff --cached --check
          git commit -m "fix(ci): repair PR 1195 source-dedupe materializer"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
