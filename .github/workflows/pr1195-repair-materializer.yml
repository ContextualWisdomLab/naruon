name: PR 1195 repair source-dedupe materializer

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1195-repair-source-dedupe-materializer
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'claude/contextualwisdomlab-audit-governance-qyxe67'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Repair the deterministic one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/pr-1195-fix-source-dedupe.yml")
          text = path.read_text(encoding="utf-8")

          assertion_pattern = re.compile(
              r'(?m)^(?P<indent>\s*)final_assertion\s*=\s*.*POP3 import.*$'
          )
          assertion_matches = list(assertion_pattern.finditer(text))
          if len(assertion_matches) != 1:
              raise RuntimeError(
                  "expected one POP3 assertion definition, found "
                  f"{len(assertion_matches)}"
              )
          assertion_indent = assertion_matches[0].group("indent")
          assertion_replacement = (
              assertion_indent
              + 'final_assertion = \'    assert imported[0]["email_data"]'
              + '["subject"] == "POP3 import"\\n\''
          )
          text = assertion_pattern.sub(assertion_replacement, text, count=1)

          commit_pattern = re.compile(
              r'(?m)^(?P<indent>\s*)git commit -m '
              r'"fix\(email\): bind untrusted-date dedupe to raw source"$'
          )
          commit_matches = list(commit_pattern.finditer(text))
          if len(commit_matches) != 1:
              raise RuntimeError(
                  "expected one final commit command, found "
                  f"{len(commit_matches)}"
              )
          commit_indent = commit_matches[0].group("indent")
          commit_replacement = (
              commit_indent
              + "git rm -- .github/workflows/pr-1195-fix-source-dedupe.yml\n"
              + commit_indent
              + 'git commit -m "fix(email): bind untrusted-date dedupe to raw source"'
          )
          text = commit_pattern.sub(commit_replacement, text, count=1)
          path.write_text(text, encoding="utf-8")
          PY

          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/pr-1195-fix-source-dedupe.yml
          git diff --check

      - name: Publish repaired materializer and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr1195-repair-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-1195-fix-source-dedupe.yml
          git diff --cached --check
          git commit -m "fix(ci): repair PR 1195 source-dedupe materializer"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
