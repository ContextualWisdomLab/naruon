name: Finalize PR 1245 selected-source writeback

on:
  push:
    branches:
      - fix/email-detail-responsive-surface-maintainer
    paths:
      - .github/workflows/finalize-pr1245-selected-source.yml

permissions:
  contents: read

concurrency:
  group: finalize-pr1245-selected-source
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/naruon' &&
      github.actor != 'github-actions[bot]' &&
      github.ref == 'refs/heads/fix/email-detail-responsive-surface-maintainer'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - name: Verify repository and bounded repair source
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f frontend/src/components/EmailDetail.tsx
          test -f frontend/src/components/EmailDetail.test.tsx
          test -f docs/doctoring/email-detail-responsive-action-surface.md
          if ! grep -q 'email-detail-calendar-source' frontend/src/components/EmailDetail.tsx; then
            test -f scripts/ci/repair_pr1245_review.py
            python3 -m py_compile scripts/ci/repair_pr1245_review.py
            python3 scripts/ci/repair_pr1245_review.py tests
            python3 scripts/ci/repair_pr1245_review.py production
          fi
          grep -q 'email-detail-calendar-source' frontend/src/components/EmailDetail.tsx
          grep -q 'target_source_id' frontend/src/components/EmailDetail.tsx
          grep -q 'role="region"' frontend/src/components/EmailDetail.tsx
          grep -q 'selected-source meeting action' frontend/src/components/EmailDetail.test.tsx
          grep -q 'writeback is pending' frontend/src/components/EmailDetail.test.tsx
          grep -q 'selected-source conflict' frontend/src/components/EmailDetail.test.tsx
          grep -q 'target_source_id' docs/doctoring/email-detail-responsive-action-surface.md
          git diff --check

      - name: Enable pinned pnpm
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        working-directory: frontend
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: pnpm install --frozen-lockfile

      - name: Verify focused and full frontend contracts
        working-directory: frontend
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          pnpm exec vitest run src/components/EmailDetail.test.tsx
          pnpm test
          pnpm run typecheck
          pnpm run lint
          pnpm run coverage

      - name: Build production frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: pnpm run build

      - name: Publish only verified product changes
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -f \
            .github/workflows/finalize-pr1245-selected-source.yml \
            .github/workflows/repair-pr1245-selected-source.yml \
            .github/workflows/repair-pr1245-selected-source-v2.yml \
            .github/workflows/repair-pr1245-review.yml \
            scripts/ci/repair_pr1245_review.py \
            scripts/ci/patch_pr1245_repair_script.py
          test -z "$(git ls-files | grep -E '(^|/)(finalize|repair)-pr1245|repair_pr1245|patch_pr1245' || true)"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo '::error::No verified product or cleanup change remains to publish.'
            exit 1
          }
          git diff --cached --check
          git commit -m "fix(email-detail): require selected writeback source"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/fix/email-detail-responsive-surface-maintainer"
