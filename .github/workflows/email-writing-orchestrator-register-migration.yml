name: Register Email Writing Migration Metadata

on:
  push:
    branches:
      - feat/llm-email-writing-orchestrator-task5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-writing-orchestrator-register-migration
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Register the modular model with Alembic
        run: |
          python - <<'PY'
          from pathlib import Path

          environment_path = Path("backend/alembic/env.py")
          environment_source = environment_path.read_text(encoding="utf-8")
          evidence_import = "from db.email_writing_evidence import EmailReviewSession\n"
          model_import = (
              "from db.email_writing_orchestrator_config "
              "import EmailWritingOrchestratorConfig\n"
          )
          if model_import not in environment_source:
              environment_source = environment_source.replace(
                  evidence_import,
                  evidence_import + model_import,
                  1,
              )
          environment_source = environment_source.replace(
              "target_metadata = EmailReviewSession.__table__.metadata",
              "target_metadata = EmailWritingOrchestratorConfig.__table__.metadata",
              1,
          )
          environment_path.write_text(environment_source, encoding="utf-8")
          Path(
              ".github/workflows/"
              "email-writing-orchestrator-register-migration.yml"
          ).unlink()
          PY
      - name: Verify Task 5 contracts
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
          cd backend
          python -m pytest -q \
            tests/test_contextual_orchestrator_client.py \
            tests/test_email_writing_orchestrator_scope.py \
            tests/test_email_writing_orchestrator_migration.py
      - name: Commit the verified registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/env.py .github/workflows/email-writing-orchestrator-register-migration.yml
          git commit -m "feat(email-writing): register orchestrator migration metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
