name: One-shot fix PR 1297 scoped identity guidance

on:
  push:
    branches:
      - fix/remove-lexical-topic-heuristics

permissions:
  contents: write

concurrency:
  group: one-shot-fix-pr-1297-agents
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
          ref: fix/remove-lexical-topic-heuristics

      - name: Apply exact guidance repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = 'ContextualWisdomLab/naruon'
          test "$GITHUB_REF" = 'refs/heads/fix/remove-lexical-topic-heuristics'
          test "$(git rev-parse HEAD^)" = 'b99558dc7bd716261372b58692546c7739fa5859'

          python - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          old = '''  reference that binds the full scope or an explicit composite identity with the
  required snapshot revision, model version, request/result scope, and label
  version. Never join snapshots, model artifacts, topic components, or label
  evidence by a bare document, model, topic, rank, label, or display value.
'''
          new = '''  reference that binds the full scope or an explicit composite identity with the
  applicable snapshot revision, model version, request/result scope, or label
  version. Define the required identity tuple for each entity; require only the
  dimensions relevant to that entity. Never join snapshots, model artifacts,
  topic components, or label evidence by a bare document, model, topic, rank,
  label, or display value.
'''
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('expected AGENTS.md identity guidance was not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm -- '.github/workflows/one-shot-fix-pr-1297-agents.yml'
          git add AGENTS.md .github/workflows/one-shot-fix-pr-1297-agents.yml
          git diff --cached --check
          git diff --cached --quiet -- AGENTS.md && exit 1

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: clarify scoped identity dimensions'
          git push origin HEAD:fix/remove-lexical-topic-heuristics
