name: Add Email Writing Judge Cancellation Regression

on:
  push:
    branches:
      - feat/llm-email-writing-orchestrator-task5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-writing-orchestrator-cancellation-red
  cancel-in-progress: false

jobs:
  add-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Append the cancellation regression
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("backend/tests/test_contextual_orchestrator_client.py")
          source = test_path.read_text(encoding="utf-8")
          test_name = "test_cancelled_judge_retains_capacity_until_worker_settles"
          addition = '''


@pytest.mark.asyncio
async def test_cancelled_judge_retains_capacity_until_worker_settles() -> None:
    """Cancellation does not return while its submitted worker still runs."""

    class _PortClient:
        async def aclose(self) -> None:
            return None

    port = EmailWritingOrchestratorPort(_PortClient(), judge_capacity=1)
    started = threading.Event()
    release = threading.Event()

    def blocking_judge() -> str:
        started.set()
        release.wait(timeout=2.0)
        return "settled"

    task = asyncio.create_task(port.run_judge(blocking_judge))
    assert await asyncio.to_thread(started.wait, 1.0)
    task.cancel()
    await asyncio.sleep(0.02)
    returned_before_worker_settled = task.done()
    release.set()
    with pytest.raises(asyncio.CancelledError):
        await task
    await port.aclose()
    assert returned_before_worker_settled is False
'''
          if test_name not in source:
              test_path.write_text(source + addition, encoding="utf-8")
          Path(
              ".github/workflows/"
              "email-writing-orchestrator-cancellation-red.yml"
          ).unlink()
          PY
      - name: Compile the test module
        run: python -m py_compile backend/tests/test_contextual_orchestrator_client.py
      - name: Commit the test-only generation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_contextual_orchestrator_client.py .github/workflows/email-writing-orchestrator-cancellation-red.yml
          git commit -m "test(email-writing): retain Judge capacity through cancellation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
