name: Dispatch stable Naruon review evidence

on:
  pull_request:
    branches:
      - develop
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dispatch-stable-naruon-review-evidence
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'ux-improvement-disabled-buttons-13634237694443312021'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout dispatcher branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ux-improvement-disabled-buttons-13634237694443312021
          fetch-depth: 0

      - name: Remove one-shot dispatcher before binding review metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/pr-1219-direct-review-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-1219-direct-review-dispatch.yml
          git commit -m "chore(ci): remove one-shot review evidence dispatcher"
          git push origin HEAD:ux-improvement-disabled-buttons-13634237694443312021

      - name: Exchange OpenCode app token
        id: app-token
        shell: bash
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator='&'
          case "$request_url" in
            *\?*) ;;
            *) separator='?' ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          test -n "$app_token"
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Dispatch exact-head Strix and OpenCode evidence
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          for pr_number in 1192 1194 1195 1203 1206 1214 1219; do
            pr_json="$(
              curl -fsS \
                -H "Authorization: Bearer ${APP_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/ContextualWisdomLab/naruon/pulls/${pr_number}"
            )"
            state="$(jq -r '.state // empty' <<<"$pr_json")"
            base_repo="$(jq -r '.base.repo.full_name // empty' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
            if [ "$state" != open ] || [ "$base_repo" != ContextualWisdomLab/naruon ] || [ "$head_repo" != ContextualWisdomLab/naruon ]; then
              echo "Skipping non-open or cross-repository PR #${pr_number}."
              continue
            fi
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
            head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

            strix_payload="$(
              jq -cn \
                --argjson pr_number "$pr_number" \
                --arg base_ref "$base_ref" \
                --arg base_sha "$base_sha" \
                --arg head_sha "$head_sha" \
                '{
                  event_type: "strix-scan",
                  client_payload: {
                    target_repository: "ContextualWisdomLab/naruon",
                    pr_number: $pr_number,
                    pr_base_ref: $base_ref,
                    pr_base_sha: $base_sha,
                    pr_head_sha: $head_sha
                  }
                }'
            )"
            opencode_payload="$(
              jq -cn \
                --argjson pr_number "$pr_number" \
                --arg base_ref "$base_ref" \
                --arg base_sha "$base_sha" \
                --arg head_ref "$head_ref" \
                --arg head_sha "$head_sha" \
                '{
                  event_type: "opencode-review",
                  client_payload: {
                    target_repository: "ContextualWisdomLab/naruon",
                    pr_number: $pr_number,
                    pr_base_ref: $base_ref,
                    pr_base_sha: $base_sha,
                    pr_head_ref: $head_ref,
                    pr_head_sha: $head_sha
                  }
                }'
            )"
            for payload in "$strix_payload" "$opencode_payload"; do
              curl -fsS \
                -X POST \
                -H "Authorization: Bearer ${APP_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/ContextualWisdomLab/.github/dispatches \
                -d "$payload"
            done
          done
