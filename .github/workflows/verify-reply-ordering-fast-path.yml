name: Verify Reply Ordering Fast Path

on:
  push:
    branches:
      - fix/reply-ordering-fast-path
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-reply-ordering-fast-path
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error
  DISABLE_BACKGROUND_WORKERS: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/reply-ordering-fast-path
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - name: Install hash-locked backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Verify deterministic ordering and reply tracking
        run: |
          cd backend
          python -m pytest -q \
            tests/test_reply_ordering_contract.py \
            tests/test_reply_tracking_service.py
          python -m ruff check \
            api/emails.py \
            services/reply_tracking_service.py \
            tests/test_reply_ordering_contract.py \
            tests/test_reply_tracking_service.py
          python -m compileall -q \
            api/emails.py \
            services/reply_tracking_service.py
      - name: Remove one-shot workflow and publish verification commit
        run: |
          set -euo pipefail
          rm .github/workflows/verify-reply-ordering-fast-path.yml
          git diff --check
          git config user.name "CWL Reply Ordering Verification"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/verify-reply-ordering-fast-path.yml
          git commit -m "ci(email): remove reply ordering verification workflow"
          git push origin HEAD:fix/reply-ordering-fast-path
