name: Temporary Search exception-redaction restack v2

on:
  push:
    branches:
      - sentinel-fix-exception-leakage-10963554164739820270

permissions:
  contents: write

concurrency:
  group: temporary-search-exception-redaction-restack-v2
  cancel-in-progress: false

jobs:
  restack:
    if: github.repository == 'ContextualWisdomLab/naruon' && github.ref == 'refs/heads/sentinel-fix-exception-leakage-10963554164739820270'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ordinary-adopt canonical exception-redaction owner
        shell: bash
        env:
          CANONICAL_HEAD: 3da3ae8e60e1bb049f59ae86bfe82db12b7e3cc7
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/heads/codex/sentinel-exception-logging-successor:refs/remotes/origin/codex/sentinel-exception-logging-successor
          test "$(git rev-parse refs/remotes/origin/codex/sentinel-exception-logging-successor)" = "$CANONICAL_HEAD"

          set +e
          git merge --no-ff --no-commit "$CANONICAL_HEAD"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U | sort)"
            test -n "$unresolved"
            while IFS= read -r path; do
              case "$path" in
                .jules/sentinel.md|backend/api/emails.py|backend/api/search.py) ;;
                *) echo "unexpected conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$unresolved"
          fi

          git checkout "$CANONICAL_HEAD" -- .jules/sentinel.md backend/api/emails.py backend/api/search.py
          git add .jules/sentinel.md backend/api/emails.py backend/api/search.py

          python - <<'PY'
          from pathlib import Path

          path = Path('backend/api/search.py')
          source = path.read_text(encoding='utf-8')
          import_anchor = 'from core.config import settings\n'
          if source.count(import_anchor) != 1:
              raise SystemExit('Search safe-logging import anchor changed')
          source = source.replace(
              import_anchor,
              import_anchor + 'from core.safe_logging import redacted_exception_info\n',
          )

          replacements = (
              (
                  '        logger.error("Search failed", exc_info=True)\n        raise HTTPException(status_code=500, detail="Search failed") from e',
                  '        logger.error("Search failed", exc_info=redacted_exception_info(e))\n        raise HTTPException(status_code=500, detail="Search failed") from None',
              ),
              (
                  '        logger.error("Grounded answer failed", exc_info=True)\n        raise HTTPException(status_code=500, detail="Answer failed") from e',
                  '        logger.error("Grounded answer failed", exc_info=redacted_exception_info(e))\n        raise HTTPException(status_code=500, detail="Answer failed") from None',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected Search exception boundary changed: {old.splitlines()[0]}')
              source = source.replace(old, new)

          forbidden = (
              'logger.error("Search failed", exc_info=True)',
              'logger.error("Grounded answer failed", exc_info=True)',
              'raise HTTPException(status_code=500, detail="Search failed") from e',
              'raise HTTPException(status_code=500, detail="Answer failed") from e',
          )
          if any(token in source for token in forbidden):
              raise SystemExit('raw Search exception boundary remains')
          path.write_text(source, encoding='utf-8')

          test_path = Path('backend/tests/test_search_exception_redaction_contract.py')
          test_path.write_text('''"""Structural regression for Search API exception-redaction wiring."""\n\nfrom pathlib import Path\n\n\ndef test_search_api_uses_canonical_redacted_traceback_boundary() -> None:\n    source_path = Path(__file__).parents[1] / "api" / "search.py"\n    source = source_path.read_text(encoding="utf-8")\n\n    assert "from core.safe_logging import redacted_exception_info" in source\n    assert 'logger.error("Search failed", exc_info=redacted_exception_info(e))' in source\n    assert 'raise HTTPException(status_code=500, detail="Search failed") from None' in source\n    assert 'logger.error("Grounded answer failed", exc_info=redacted_exception_info(e))' in source\n    assert 'raise HTTPException(status_code=500, detail="Answer failed") from None' in source\n    assert 'logger.error("Search failed", exc_info=True)' not in source\n    assert 'logger.error("Grounded answer failed", exc_info=True)' not in source\n''', encoding='utf-8')
          PY

          git add backend/api/search.py backend/tests/test_search_exception_redaction_contract.py
          git diff --check

      - name: Commit canonical restack and remove one-shot workflow
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          CANONICAL_HEAD: 3da3ae8e60e1bb049f59ae86bfe82db12b7e3cc7
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-search-exception-redaction-restack-v2.yml
          git add .github/workflows/temporary-search-exception-redaction-restack-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(search): consume canonical exception redaction'

          git merge-base --is-ancestor "$CANONICAL_HEAD" HEAD
          effective="$(git diff --name-only "$CANONICAL_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n' 'backend/api/search.py' 'backend/tests/test_search_exception_redaction_contract.py' | sort)"
          test "$effective" = "$expected"
          test ! -e .github/workflows/temporary-search-exception-redaction-restack-v2.yml

          remote_head="$(git ls-remote origin refs/heads/sentinel-fix-exception-leakage-10963554164739820270 | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:sentinel-fix-exception-leakage-10963554164739820270