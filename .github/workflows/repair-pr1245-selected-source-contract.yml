name: Repair PR 1245 selected calendar source contract

on:
  push:
    branches:
      - fix/email-detail-responsive-surface-maintainer
    paths:
      - scripts/ci/repair_pr1245_selected_source_contract.py
      - .github/workflows/repair-pr1245-selected-source-contract.yml

permissions:
  contents: read

concurrency:
  group: pr-1245-selected-source-contract
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/naruon' &&
      github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner with blocking egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable trigger and repair helper idempotence
        run: |
          set -euo pipefail
          expected_parent="354f6c3413bf0efde9e059e002b2f9864d6a3460"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/repair_pr1245_selected_source_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''    old_count = text.count(old)\n    new_count = text.count(new)\n    if old_count == 1 and new_count == 0:\n        path.write_text(text.replace(old, new, 1), encoding="utf-8")\n        return\n    if old_count == 0 and new_count == 1:\n        return\n'''
          new = '''    old_count = text.count(old)\n    if new == "":\n        if old_count == 1:\n            path.write_text(text.replace(old, new, 1), encoding="utf-8")\n            return\n        if old_count == 0:\n            return\n        new_count = 0\n    else:\n        new_count = text.count(new)\n        if old_count == 1 and new_count == 0:\n            path.write_text(text.replace(old, new, 1), encoding="utf-8")\n            return\n        if old_count == 0 and new_count == 1:\n            return\n'''
          if text.count(old) != 1:
              raise SystemExit("replace_once helper anchor not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 -m py_compile scripts/ci/repair_pr1245_selected_source_contract.py

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Install regression first and prove a meaningful red state
        run: |
          set -euo pipefail
          python3 scripts/ci/repair_pr1245_selected_source_contract.py --tests
          set +e
          cd frontend
          pnpm exec vitest run src/components/EmailDetail.test.tsx >"${RUNNER_TEMP}/pr1245-selected-source-red.log" 2>&1
          status=$?
          cd ..
          set -e
          cat "${RUNNER_TEMP}/pr1245-selected-source-red.log"
          test "$status" -ne 0
          grep -F 'requires an explicit server-authorized calendar source' "${RUNNER_TEMP}/pr1245-selected-source-red.log"
          if grep -Eq '(Timeout|Fatal|Denied)' "${RUNNER_TEMP}/pr1245-selected-source-red.log"; then
            echo '::error::Red-stage failure contained forbidden infrastructure evidence.'
            exit 1
          fi

      - name: Apply production repair
        run: |
          set -euo pipefail
          python3 scripts/ci/repair_pr1245_selected_source_contract.py --production
          git diff --check

      - name: Run focused EmailDetail regression
        run: cd frontend && pnpm exec vitest run src/components/EmailDetail.test.tsx

      - name: Run complete frontend quality gate
        run: |
          set -euo pipefail
          cd frontend
          pnpm test
          pnpm run typecheck
          pnpm run lint
          pnpm run coverage

      - name: Build production frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        run: cd frontend && pnpm run build

      - name: Publish verified product repair and remove temporary machinery
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-pr1245-selected-source-contract.yml \
            scripts/ci/repair_pr1245_selected_source_contract.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(email-detail): require selected calendar source"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:fix/email-detail-responsive-surface-maintainer"
