name: PR 1203 release governance fix

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1203-release-governance-fix
  cancel-in-progress: true

jobs:
  fix-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'codex/docker-base-current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/docker-base-current
          fetch-depth: 0

      - name: Align the security-pin governance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_release_governance.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "cryptography==49.0.0" in strix_ci_requirements\n'
          new = '    assert "cryptography==50.0.0" in strix_ci_requirements\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("stale cryptography assertion not found exactly once")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install and verify the full backend contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt \
            -r backend/requirements-agent.txt
          cd backend
          python -m ruff check tests/test_release_governance.py
          python -m pytest -q \
            tests/test_release_governance.py::test_strix_ci_requirements_use_security_quality_clean_pins
          python -m pytest -q

      - name: Publish verified fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/pr-1203-release-governance-fix.yml
          git add backend/tests/test_release_governance.py
          git diff --cached --check
          git commit -m "test(governance): align Strix cryptography security pin"
          git push origin HEAD:codex/docker-base-current
