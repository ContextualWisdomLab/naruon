name: Temporary Search detail-tab restack

on:
  push:
    branches:
      - jules-1482523290057916017-f52e43d7

permissions:
  contents: write

concurrency:
  group: temporary-search-detail-restack
  cancel-in-progress: false

jobs:
  restack:
    if: github.repository == 'ContextualWisdomLab/naruon' && github.ref == 'refs/heads/jules-1482523290057916017-f52e43d7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Ordinary-restack onto repaired Search owner
        shell: bash
        env:
          PARENT_HEAD: d65a34773540147f568fab7aeeaf28835071ede2
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/search-customer-copy:refs/remotes/origin/codex/search-customer-copy
          test "$(git rev-parse refs/remotes/origin/codex/search-customer-copy)" = "$PARENT_HEAD"
          git merge --no-ff --no-commit "$PARENT_HEAD"
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/temporary-search-detail-restack.yml
          git add .github/workflows/temporary-search-detail-restack.yml
          git diff --cached --check

      - name: Commit helper-free restack and push normally
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          PARENT_HEAD: d65a34773540147f568fab7aeeaf28835071ede2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(search): restack detail tabs on repaired owner'
          test ! -e .github/workflows/temporary-search-detail-restack.yml
          effective="$(git diff --name-only "$PARENT_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n' 'frontend/src/components/SearchLayout.test.tsx' 'frontend/src/components/SearchLayout.tsx' 'frontend/tests/e2e/search-detail-tabs.spec.ts' | sort)"
          test "$effective" = "$expected"
          remote_head="$(git ls-remote origin refs/heads/jules-1482523290057916017-f52e43d7 | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:jules-1482523290057916017-f52e43d7
