name: PR 1195 repair source-identity finalizer

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1195-repair-source-identity-finalizer
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ github.event.pull_request.head.ref == 'claude/contextualwisdomlab-audit-governance-qyxe67' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Repair dependency order and transport anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/pr-1195-source-identity-finalize.yml")
          text = path.read_text(encoding="utf-8")

          setup_block = '''      - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                python-version: "3.14"
                cache: pip
                cache-dependency-path: backend/requirements-hashes.txt

            - name: Install hash-locked backend dependencies
              run: >-
                python -m pip install --disable-pip-version-check --require-hashes
                -r backend/requirements-hashes.txt

          '''.replace("          ", "")
          if text.count(setup_block) != 1:
              raise SystemExit(
                  f"expected one late dependency block, found {text.count(setup_block)}"
              )
          text = text.replace(setup_block, "", 1)
          red_anchor = "      - name: Add source-identity regressions first\n"
          if text.count(red_anchor) != 1:
              raise SystemExit(
                  f"expected one regression anchor, found {text.count(red_anchor)}"
              )
          text = text.replace(red_anchor, setup_block + red_anchor, 1)

          imap_pattern = re.compile(
              r"          old_call = '''                    await process_fetched_email\(\n"
              r".*?"
              r"                  raise SystemExit\(\"IMAP transport call anchor not found exactly once\"\)",
              re.DOTALL,
          )
          imap_replacement = '''          old_call = (
              "                    await process_fetched_email(\\n"
              "                        session,\\n"
              "                        email_data,\\n"
              "                        config.user_id,\\n"
              "                        config.organization_id,\\n"
              "                        owner_addresses=owner_addresses,\\n"
              "                        is_read=is_read,\\n"
              "                    )"
          )
          new_call = (
              "                    await process_fetched_email(\\n"
              "                        session,\\n"
              "                        email_data,\\n"
              "                        config.user_id,\\n"
              "                        config.organization_id,\\n"
              "                        owner_addresses=owner_addresses,\\n"
              "                        is_read=is_read,\\n"
              "                        source_content=raw_message,\\n"
              "                    )"
          )
          if new_call not in text:
              if text.count(old_call) != 1:
                  raise SystemExit("IMAP transport call anchor not found exactly once")'''
          text, imap_count = imap_pattern.subn(imap_replacement, text, count=1)
          if imap_count != 1:
              raise SystemExit(f"expected one IMAP finalizer block, found {imap_count}")

          pop3_pattern = re.compile(
              r"          old_call = '''                    await process_fetched_email\(\n"
              r".*?"
              r"                  raise SystemExit\(\"POP3 transport call anchor not found exactly once\"\)",
              re.DOTALL,
          )
          pop3_replacement = '''          old_call = (
              "                    await process_fetched_email(\\n"
              "                        session,\\n"
              "                        email_data,\\n"
              "                        config.user_id,\\n"
              "                        config.organization_id,\\n"
              "                        owner_addresses=owner_addresses,\\n"
              "                    )"
          )
          new_call = (
              "                    await process_fetched_email(\\n"
              "                        session,\\n"
              "                        email_data,\\n"
              "                        config.user_id,\\n"
              "                        config.organization_id,\\n"
              "                        owner_addresses=owner_addresses,\\n"
              "                        source_content=raw_message,\\n"
              "                    )"
          )
          if new_call not in text:
              if text.count(old_call) != 1:
                  raise SystemExit("POP3 transport call anchor not found exactly once")'''
          text, pop3_count = pop3_pattern.subn(pop3_replacement, text, count=1)
          if pop3_count != 1:
              raise SystemExit(f"expected one POP3 finalizer block, found {pop3_count}")

          path.write_text(text, encoding="utf-8")
          PY
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/pr-1195-source-identity-finalize.yml
          git diff --check

      - name: Publish repaired finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr-1195-repair-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-1195-source-identity-finalize.yml
          git diff --cached --check
          git commit -m "fix(ci): repair PR 1195 source-identity finalizer"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
