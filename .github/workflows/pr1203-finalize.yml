name: PR 1203 container provenance finalizer

on:
  push:
    branches:
      - codex/docker-base-current

concurrency:
  group: pr-1203-container-provenance-finalizer
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 3
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify ancestry and apply bounded repair
        run: |
          set -euo pipefail
          expected_parent="7077d23a503d1f6c76b87350151c810503b89086"
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$expected_parent" ]; then
            printf '::error::Finalizer trigger parent moved: expected %s, got %s.\n' "$expected_parent" "$actual_parent"
            exit 1
          fi
          test -f scripts/ci/repair_pr_1203_provenance.py
          python3 scripts/ci/repair_pr_1203_provenance.py

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev-hashes.txt

      - name: Install hash-locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev-hashes.txt

      - name: Run focused provenance and governance tests
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_container_provenance_contract.py \
            tests/test_release_governance.py \
            tests/test_repo_hygiene.py

      - name: Validate workflow, Python, and final diff
        run: |
          set -euo pipefail
          python -m compileall -q \
            backend/tests/test_container_provenance_contract.py \
            backend/tests/test_release_governance.py \
            backend/tests/test_repo_hygiene.py
          python -c 'from pathlib import Path; import yaml; yaml.safe_load(Path(".github/workflows/docker-publish.yml").read_text(encoding="utf-8")); yaml.safe_load(Path(".github/workflows/pr1203-finalize.yml").read_text(encoding="utf-8"))'
          git diff --check

      - name: Commit verified product repair and remove temporary machinery
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr1203-finalize.yml \
            scripts/ci/repair_pr_1203_provenance.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(container): verify current provenance inputs"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:codex/docker-base-current"
