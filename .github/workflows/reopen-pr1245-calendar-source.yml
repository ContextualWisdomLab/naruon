name: Reopen PR 1245 calendar source repair

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

concurrency:
  group: reopen-pr1245-calendar-source
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/naruon' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/email-detail-responsive-surface-maintainer'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact reopened head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact RED lineage and bounded reopen trigger
        env:
          RED_HEAD: e086f752f8a5640c36ba1405524233c79ff9b4a7
          PRIOR_HEAD: c6cb20356f14988b954b75a9c45c678886215d86
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$PRIOR_HEAD"
          git merge-base --is-ancestor "$RED_HEAD" HEAD
          mapfile -t trigger_delta < <(git diff --name-only "$PRIOR_HEAD" HEAD)
          test "${#trigger_delta[@]}" -eq 1
          test "${trigger_delta[0]}" = ".github/workflows/reopen-pr1245-calendar-source.yml"
          test -f scripts/ci/apply_pr1245_calendar_source_repair.py
          test -f .github/workflows/repair-pr1245-calendar-source.yml

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Install frozen frontend dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          corepack enable pnpm
          cd frontend
          pnpm install --frozen-lockfile

      - name: Preserve the exact failing product contract
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          cd frontend
          pnpm exec vitest run src/components/EmailDetail.calendar-writeback.test.tsx \
            >"${RUNNER_TEMP}/pr1245-red.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/pr1245-red.log"
          test "$status" -eq 1
          grep -F '4 failed' "${RUNNER_TEMP}/pr1245-red.log"
          grep -F 'expected null not to be null' "${RUNNER_TEMP}/pr1245-red.log"

      - name: Apply reviewed source-confirmation repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/apply_pr1245_calendar_source_repair.py")
          source = path.read_text(encoding="utf-8")

          old_action_items = '    render_action_items = "  const actionItems = llmData?.action_items ?? [];\\n"\n'
          new_action_items = (
              '    render_action_items = (\n'
              '        "  const confidencePercent = toConfidencePercent(llmData?.confidence);\\n"\n'
              '        "  const actionItems = llmData?.action_items ?? [];\\n"\n'
              '    )\n'
          )
          if source.count(old_action_items) != 1:
              raise SystemExit("expected one rendered action-item marker declaration")
          source = source.replace(old_action_items, new_action_items, 1)

          conflict_start = source.index("    conflict_action_end = _block(\n")
          conflict_end = source.index("\n    footer_button = _block(\n", conflict_start)
          conflict_replacement = """    source = _replace_once(
              source,
              "                  {isSyncing ? \\\"조율 중\\\" : \\\"일정 조율\\\"}\\n"
              "                </Button>\\n"
              "              </div>\\n"
              "            </div>\\n"
              "          )}\\n",
              "                  {isSyncing ? \\\"조율 중\\\" : \\\"일정 조율\\\"}\\n"
              "                </Button>\\n"
              "              </div>\\n"
              "              <div className=\\\"mt-3\\\">{calendarSourceSelector}</div>\\n"
              "            </div>\\n"
              "          )}\\n",
              label="meeting source confirmation panel",
          )
          """
          source = source[:conflict_start] + conflict_replacement + source[conflict_end:]

          footer_start = source.index("    footer_button = _block(\n")
          footer_end = source.index("\n    action_card_body = _block(\n", footer_start)
          footer_replacement = """    source = _replace_once(
              source,
              "                  <Button>\\n",
              "                  <Button>\\n",
              label="action-card button anchor preflight",
          )
          source = _replace_once(
              source,
              "                    disabled={isSyncing}\\n"
              "                    aria-busy={isSyncing}\\n"
              "                    className=\\\"h-9 rounded-xl bg-emerald-600 px-4 text-white hover:bg-emerald-700\\\"\\n",
              "                    disabled={isCalendarWritebackDisabled}\\n"
              "                    aria-busy={isSyncing}\\n"
              "                    className=\\\"h-9 rounded-xl bg-emerald-600 px-4 text-white hover:bg-emerald-700\\\"\\n",
              label="action-card calendar button",
          )
          """
          source = source[:footer_start] + footer_replacement + source[footer_end:]

          action_start = source.index("    action_card_body = _block(\n")
          action_end = source.index("\n    EMAIL_DETAIL_PATH.write_text", action_start)
          action_replacement = """    source = _replace_once(
              source,
              "          >\\n"
              "            {llmData ? (\\n"
              "              actionItems.length > 0 ? (\\n",
              "          >\\n"
              "            {!email.schedule_conflict && actionItems.length > 0 ? (\\n"
              "              <div className=\\\"mb-3\\\">{calendarSourceSelector}</div>\\n"
              "            ) : null}\\n"
              "            {llmData ? (\\n"
              "              actionItems.length > 0 ? (\\n",
              label="non-conflict source confirmation panel",
          )
          """
          source = source[:action_start] + action_replacement + source[action_end:]
          path.write_text(source, encoding="utf-8")
          PY
          python3 scripts/ci/apply_pr1245_calendar_source_repair.py
          test ! -e .github/workflows/reopen-pr1245-calendar-source.yml
          test ! -e .github/workflows/repair-pr1245-calendar-source.yml
          test ! -e scripts/ci/apply_pr1245_calendar_source_repair.py
          git diff --check

      - name: Verify focused and complete frontend behavior
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        run: |
          cd frontend
          pnpm exec vitest run \
            src/components/EmailDetail.calendar-writeback.test.tsx \
            src/components/EmailDetail.test.tsx
          pnpm test
          pnpm run typecheck
          pnpm run lint
          pnpm run coverage
          pnpm run build

      - name: Verify durable final-tree boundaries
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test ! -e .github/workflows/reopen-pr1245-calendar-source.yml
          test ! -e .github/workflows/repair-pr1245-calendar-source.yml
          test ! -e scripts/ci/apply_pr1245_calendar_source_repair.py
          grep -F 'role="region"' frontend/src/components/EmailDetail.tsx
          grep -F 'aria-label="일정 원본 선택"' frontend/src/components/EmailDetail.tsx
          grep -F 'target_source_id: selectedSource.source_id' frontend/src/components/EmailDetail.tsx
          grep -F 'Promise.allSettled' frontend/src/components/EmailDetail.tsx
          grep -F 'calendar_event_id: null' frontend/src/components/EmailDetail.tsx
          grep -F 'source conflict' docs/doctoring/email-detail-responsive-action-surface.md
          git diff --check

      - name: Publish verified product commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No verified product change was produced.'; exit 1; }
          git commit -m "fix(email-detail): require explicit calendar source"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
