name: Repair PR 1243 EmailDetail interaction

on:
  push:
    branches:
      - fix-email-detail-ui-1403318425663803977

concurrency:
  group: repair-pr1243-email-detail
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore exact backend base and apply bounded frontend repair
        run: |
          set -euo pipefail
          expected_parent="d0878ed47c44b0fb52d6b505e6bbaef3559bb0f2"
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$expected_parent" ]; then
            printf '::error::Repair trigger parent moved: expected %s, got %s.\n' "$expected_parent" "$actual_parent"
            exit 1
          fi
          base_sha="be3bedb4bc5f264c9d621e2666b8583b3b149eca"
          git fetch --depth=1 origin "$base_sha"
          for path in \
            backend/api/emails.py \
            backend/services/email_import_service.py \
            backend/services/tenant_config_scope.py
          do
            git show "${base_sha}:${path}" >"${path}"
          done
          python3 scripts/ci/repair_pr_1243_email_detail.py
          git diff --check

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run focused EmailDetail interaction regression
        run: cd frontend && pnpm exec vitest run src/components/EmailDetail.test.tsx

      - name: Run full frontend tests, type checking, lint, and coverage collection
        run: |
          set -euo pipefail
          cd frontend
          pnpm test
          pnpm run typecheck
          pnpm run lint
          pnpm run coverage

      - name: Build production frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        run: cd frontend && pnpm run build

      - name: Verify restored backend blobs and documentation
        run: |
          set -euo pipefail
          base_sha="be3bedb4bc5f264c9d621e2666b8583b3b149eca"
          for path in \
            backend/api/emails.py \
            backend/services/email_import_service.py \
            backend/services/tenant_config_scope.py
          do
            test "$(git hash-object "$path")" = "$(git rev-parse "${base_sha}:${path}")"
          done
          test -f docs/doctoring/email-detail-responsive-action-surface.md
          python -m compileall -q scripts/ci/repair_pr_1243_email_detail.py
          git diff --check

      - name: Commit verified product repair and remove temporary machinery
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-pr1243-email-detail.yml \
            scripts/ci/repair_pr_1243_email_detail.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(email-detail): make responsive evidence actions functional"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:fix-email-detail-ui-1403318425663803977"
