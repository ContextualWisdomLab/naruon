name: PR 1239 schema compatibility repair

# One-shot current-head repair; the final verified commit removes this workflow.
on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1239-schema-compatibility
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ github.event.pull_request.head.ref == 'fix/disksage-schema-v4-current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/disksage-schema-v4-current
          fetch-depth: 0

      - name: Apply supported-version compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("backend/scripts/disksage_copy_readiness_handoff.py")
          source = source_path.read_text(encoding="utf-8")
          old = '            and payload.get("schema_version") == 4\n'
          new = '            and payload.get("schema_version") in (3, 4)\n'
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(
                      f"expected one schema-version anchor, found {source.count(old)}"
                  )
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("backend/tests/test_disksage_copy_readiness_handoff.py")
          tests = test_path.read_text(encoding="utf-8")
          old_rejection = '        ({**_success_payload(), "schema_version": 3}, 0),\n'
          new_rejection = '        ({**_success_payload(), "schema_version": 5}, 0),\n'
          if new_rejection not in tests:
              if tests.count(old_rejection) != 1:
                  raise SystemExit(
                      "expected one obsolete-version rejection, found "
                      f"{tests.count(old_rejection)}"
                  )
              tests = tests.replace(old_rejection, new_rejection, 1)

          marker = '@pytest.mark.parametrize("exit_code", [64, 65])\n'
          regression = "\n".join(
              [
                  '@pytest.mark.parametrize("schema_version", [3, 4])',
                  "def test_protocol_decoder_accepts_supported_schema_versions(schema_version):",
                  '    """Accept the deployed v3 contract and the WAL-consistent v4 contract."""',
                  '    payload = {**_success_payload(), "schema_version": schema_version}',
                  "    result = handoff.VerifierResult(",
                  "        0,",
                  '        json.dumps(payload).encode("utf-8"),',
                  '        b"",',
                  "    )",
                  "",
                  "    assert handoff._decode_protocol(result) == payload",
                  "",
                  "",
              ]
          )
          if "test_protocol_decoder_accepts_supported_schema_versions" not in tests:
              if tests.count(marker) != 1:
                  raise SystemExit(
                      f"expected one insertion marker, found {tests.count(marker)}"
                  )
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install and validate focused backend scope
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt
          cd backend
          python -m ruff format scripts/disksage_copy_readiness_handoff.py tests/test_disksage_copy_readiness_handoff.py
          python -m ruff check scripts/disksage_copy_readiness_handoff.py tests/test_disksage_copy_readiness_handoff.py
          python -m ruff format --check scripts/disksage_copy_readiness_handoff.py tests/test_disksage_copy_readiness_handoff.py
          python -m pytest -q tests/test_disksage_copy_readiness_handoff.py

      - name: Publish verified repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/pr-1239-schema-compatibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/scripts/disksage_copy_readiness_handoff.py \
            backend/tests/test_disksage_copy_readiness_handoff.py
          git diff --cached --check
          git commit -m "fix(disksage): preserve v3 and v4 verifier compatibility"
          git push origin HEAD:fix/disksage-schema-v4-current
