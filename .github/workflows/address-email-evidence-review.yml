name: Address Email Evidence Review

on:
  push:
    branches:
      - feat/llm-email-writing-review-evidence-task3
    paths:
      - .github/scripts/address_email_evidence_review.py
      - .github/workflows/address-email-evidence-review.yml

permissions:
  contents: write

concurrency:
  group: address-email-evidence-review
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/llm-email-writing-review-evidence-task3
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Install hash-verified coverage tool
        run: |
          set -euo pipefail
          mkdir -p /tmp/coverage-wheel
          cat >/tmp/coverage-lock.txt <<'EOF'
          coverage==7.15.2 --hash=sha256:eb6bcae8d1a9d305351ecb108232441d11c5cfe9de840a04388ba5d2db8d735c
          EOF
          python -m pip download \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            --only-binary=:all: \
            --platform any \
            --python-version 3.14 \
            --implementation py \
            --abi none \
            --dest /tmp/coverage-wheel \
            -r /tmp/coverage-lock.txt
          python -m pip install --disable-pip-version-check --no-deps /tmp/coverage-wheel/coverage-7.15.2-py3-none-any.whl
      - name: Apply verified review fixes
        run: python .github/scripts/address_email_evidence_review.py
      - name: Run repaired tests under safety settings
        env:
          PYTHONWARNINGS: error
          DISABLE_BACKGROUND_WORKERS: "1"
        run: |
          set -euo pipefail
          cd backend
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          set +e
          python -m pytest -q \
            tests/test_email_writing_models.py \
            tests/test_email_writing_migration.py 2>&1 | tee "$output_file"
          test_status=${PIPESTATUS[0]}
          set -e
          if grep -Eiq '(^|[^[:alnum:]_])(Timeout|Fatal|Warn|Denied)([^[:alnum:]_]|$)' "$output_file"; then
            echo "::error::Backend tests emitted prohibited stability output."
            exit 1
          fi
          exit "$test_status"
      - name: Verify migration coverage under safety settings
        env:
          PYTHONWARNINGS: error
          DISABLE_BACKGROUND_WORKERS: "1"
        run: |
          set -euo pipefail
          cd backend
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          python -m coverage erase
          set +e
          python -m coverage run --branch \
            --include='alembic/versions/20260812_0001_add_email_writing_review_evidence.py' \
            -m pytest -q tests/test_email_writing_migration.py 2>&1 | tee "$output_file"
          test_status=${PIPESTATUS[0]}
          set -e
          if grep -Eiq '(^|[^[:alnum:]_])(Timeout|Fatal|Warn|Denied)([^[:alnum:]_]|$)' "$output_file"; then
            echo "::error::Coverage tests emitted prohibited stability output."
            exit 1
          fi
          if [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi
          python -m coverage report --show-missing --fail-under=100 \
            alembic/versions/20260812_0001_add_email_writing_review_evidence.py
      - name: Lint repaired scope
        run: |
          cd backend
          python -m ruff check \
            db/email_writing_evidence.py \
            alembic/env.py \
            alembic/versions/20260812_0001_add_email_writing_review_evidence.py \
            tests/test_email_writing_models.py \
            tests/test_email_writing_migration.py
      - name: Validate exact patch scope
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed_files < <(git diff --name-only | LC_ALL=C sort)
          expected_files=(
            .github/workflows/email-writing-evidence-tdd.yml
            backend/db/email_writing_evidence.py
            backend/tests/test_email_writing_migration.py
            backend/tests/test_email_writing_models.py
          )
          if ! diff -u \
            <(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${changed_files[@]}"); then
            echo "::error::Evidence review repair changed an unexpected file."
            exit 1
          fi
      - name: Commit verified review repair and remove one-shot files
        env:
          BRANCH_NAME: feat/llm-email-writing-review-evidence-task3
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/email-writing-evidence-tdd.yml \
            backend/db/email_writing_evidence.py \
            backend/tests/test_email_writing_migration.py \
            backend/tests/test_email_writing_models.py
          git rm -f \
            .github/scripts/address_email_evidence_review.py \
            .github/workflows/address-email-evidence-review.yml
          git commit -m "fix(email-writing): address review evidence findings"
          git push origin "HEAD:${BRANCH_NAME}"
