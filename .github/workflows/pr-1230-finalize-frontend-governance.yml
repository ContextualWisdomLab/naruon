name: PR 1230 finalize frontend dependency governance

on:
  push:
    branches:
      - dependabot/npm_and_yarn/frontend/frontend-npm-6c49e239bc
    paths:
      - .github/workflows/pr-1230-finalize-frontend-governance.yml

concurrency:
  group: pr-1230-finalize-frontend-governance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/npm_and_yarn/frontend/frontend-npm-6c49e239bc
          fetch-depth: 0
          persist-credentials: true

      - name: Align the permanent PostCSS governance contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_release_governance.py")
          source = path.read_text(encoding="utf-8")
          occurrences = source.count('"8.5.24"')
          if occurrences == 0:
              raise SystemExit("Expected the stale PostCSS 8.5.24 governance values")
          source = source.replace('"8.5.24"', '"8.5.25"')
          path.write_text(source, encoding="utf-8")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the exact frontend closure
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.5.3 --activate
          cd frontend
          pnpm install --frozen-lockfile
          test "$(pnpm exec node -p \"require('postcss/package.json').version\")" = "8.5.25"

      - name: Verify frontend lint, types, tests, coverage, and production build
        run: |
          cd frontend
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run coverage
          pnpm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Verify the release-governance regression
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
          python -m ruff check backend/tests/test_release_governance.py
          python -m pytest backend/tests/test_release_governance.py -q
          git diff --check

      - name: Commit only verified permanent changes
        run: |
          rm .github/workflows/pr-1230-finalize-frontend-governance.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tests/test_release_governance.py
          git commit -m "test(frontend): align PostCSS governance to 8.5.25"
          git push origin HEAD:dependabot/npm_and_yarn/frontend/frontend-npm-6c49e239bc

# Trigger exact-head governance repair; this temporary workflow deletes itself after verification.
