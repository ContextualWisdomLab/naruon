name: PR 1230 finalize frontend dependency governance

on:
  push:
    branches:
      - dependabot/npm_and_yarn/frontend/frontend-npm-6c49e239bc
    paths:
      - .github/workflows/pr-1230-finalize-frontend-governance.yml

concurrency:
  group: pr-1230-finalize-frontend-governance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
      TARGET_BRANCH: dependabot/npm_and_yarn/frontend/frontend-npm-6c49e239bc
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout the exact triggering head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact trigger identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"

      - name: Align the permanent PostCSS governance contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_release_governance.py")
          source = path.read_text(encoding="utf-8")
          occurrences = source.count('"8.5.24"')
          if occurrences == 0:
              raise SystemExit("Expected the stale PostCSS 8.5.24 governance values")
          source = source.replace('"8.5.24"', '"8.5.25"')
          if '"8.5.24"' in source:
              raise SystemExit("A stale PostCSS governance value remains")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the exact frontend closure
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@11.5.3 --activate
          cd frontend
          pnpm install --frozen-lockfile
          test "$(pnpm exec node -p \"require('postcss/package.json').version\")" = "8.5.25"
          pnpm why postcss

      - name: Verify frontend lint, types, tests, coverage, and production build
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run coverage
          POSTCSS_WORKERS=1 DISABLE_POSTCSS_WORKERS=true pnpm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Verify the release-governance regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
          python -m ruff check backend/tests/test_release_governance.py
          python -m pytest backend/tests/test_release_governance.py -q
          git diff --check

      - name: Commit verified permanent changes and remove this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/pr-1230-finalize-frontend-governance.yml
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
          git status --short | grep -F ' M backend/tests/test_release_governance.py'
          git status --short | grep -F ' D .github/workflows/pr-1230-finalize-frontend-governance.yml'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- backend/tests/test_release_governance.py .github/workflows/pr-1230-finalize-frontend-governance.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'backend/tests/test_release_governance.py'
          git diff --cached --name-only | grep -Fx '.github/workflows/pr-1230-finalize-frontend-governance.yml'
          git commit -m "test(frontend): align PostCSS governance to 8.5.25"

          expected_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat >"$askpass" <<'SH'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${GH_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -c core.hooksPath=/dev/null push \
              "$expected_origin" "HEAD:refs/heads/${TARGET_BRANCH}"

# Trigger exact-head governance repair v2; this temporary workflow deletes itself after verification.
