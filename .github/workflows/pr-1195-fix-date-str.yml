name: PR 1195 repair finalizer contracts

on:
  push:
    branches:
      - claude/contextualwisdomlab-audit-governance-qyxe67

permissions:
  contents: read

concurrency:
  group: pr-1195-repair-finalizer-contracts
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Repair finalizer idempotence and date cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr-1195-source-identity-finalize.yml")
          text = path.read_text(encoding="utf-8")

          guard_old = "if new in text:"
          guard_new = "if new and new in text:"
          if guard_new not in text:
              count = text.count(guard_old)
              if count != 1:
                  raise SystemExit(
                      f"expected one empty-replacement guard, found {count}"
                  )
              text = text.replace(guard_old, guard_new, 1)

          if "          date_string_block = (\n" not in text:
              marker = (
                  '              "IMAP synthetic date string",\n'
                  "          )\n"
              )
              marker_end = text.find(marker)
              if marker_end < 0:
                  raise SystemExit("IMAP synthetic date cleanup marker not found")
              marker_end += len(marker)
              block_start = text.rfind(
                  "          text = replace_once(\n", 0, marker_end
              )
              if block_start < 0:
                  raise SystemExit("IMAP synthetic date cleanup block not found")
              replacement = '''          date_string_block = (
              "    if hasattr(date_obj, \\\"isoformat\\\"):\\n"
              "        date_str = date_obj.isoformat()\\n"
              "    else:\\n"
              "        date_str = str(date_obj) if date_obj else \\\"\\\"\\n"
          )
          if date_string_block in text:
              text = text.replace(date_string_block, "", 1)
          elif "date_str =" in text:
              raise SystemExit("IMAP synthetic date string block changed unexpectedly")
'''
              text = text[:block_start] + replacement + text[marker_end:]

          path.write_text(text, encoding="utf-8")
          PY
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/pr-1195-source-identity-finalize.yml
          git diff --check

      - name: Publish repaired finalizer and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          branch=claude/contextualwisdomlab-audit-governance-qyxe67
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          if [ "$remote_head" != "$local_head" ]; then
            echo "A newer branch head already exists; this stale repair run exits safely."
            exit 0
          fi
          git rm --ignore-unmatch -- \
            .github/workflows/pr-1195-fix-date-str.yml \
            .github/workflows/pr-1195-finalizer-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-1195-source-identity-finalize.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalizer repair remains to publish."
            exit 0
          fi
          git commit -m "fix(ci): make PR 1195 finalizer deterministic"
          git push origin HEAD:${branch}
