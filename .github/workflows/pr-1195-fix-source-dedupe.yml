name: PR 1195 fix source-bound email deduplication

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1195-fix-source-bound-dedupe
  cancel-in-progress: true

jobs:
  fix-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'claude/contextualwisdomlab-audit-governance-qyxe67' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Merge the current protected base locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/develop

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install hash-locked backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r backend/requirements-hashes.txt

      - name: Add failing source-identity regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/tests/test_source_bound_email_dedupe.py <<'PY'
          """Regression tests for source-bound fallback email identities."""

          import datetime
          from pathlib import Path
          from unittest.mock import AsyncMock, MagicMock

          import pytest

          from services.email_dedupe_service import (
              source_email_fingerprint,
              strong_email_fingerprint,
          )
          from services.email_import_service import _email_fingerprint
          from services.imap_worker import (
              _canonical_source_content,
              process_fetched_email,
          )


          def test_source_email_fingerprint_is_domain_separated_and_content_bound() -> None:
              """Hash identical sources identically and distinct sources differently."""
              first = source_email_fingerprint(b"same source")
              assert first == source_email_fingerprint(b"same source")
              assert first != source_email_fingerprint(b"different source")
              assert len(first) == 64


          def test_import_fingerprint_uses_raw_source_when_date_is_untrusted() -> None:
              """Keep storage time out of missing/invalid-Date duplicate evidence."""
              persisted_date = datetime.datetime(
                  2026, 8, 4, 6, 30, tzinfo=datetime.timezone.utc
              )
              fields = {
                  "sender": "sender@example.com",
                  "subject": "Same subject",
                  "body": "Same parsed body",
                  "recipients": "recipient@example.com",
              }
              first_source = b"From: sender@example.com\r\n\r\nFirst raw body"
              second_source = b"From: sender@example.com\r\n\r\nSecond raw body"
              strong = strong_email_fingerprint(
                  sender=fields["sender"],
                  subject=fields["subject"],
                  date=persisted_date,
                  body=fields["body"],
              )
              assert strong is not None
              assert (
                  _email_fingerprint(
                      {**fields, "date_provenance": "parsed"},
                      persisted_date,
                      first_source,
                  )
                  == strong
              )
              for provenance in ("missing", "invalid"):
                  first = _email_fingerprint(
                      {**fields, "date_provenance": provenance},
                      persisted_date,
                      first_source,
                  )
                  second = _email_fingerprint(
                      {**fields, "date_provenance": provenance},
                      persisted_date,
                      second_source,
                  )
                  assert first == source_email_fingerprint(first_source)
                  assert second == source_email_fingerprint(second_source)
                  assert first != second


          def test_canonical_source_content_is_deterministic_and_identity_sensitive() -> None:
              """Provide a stable fallback for non-transport direct callers."""
              base = {
                  "message_id": "<message@example.com>",
                  "sender": "sender@example.com",
                  "recipients": ["one@example.com", "two@example.com"],
                  "subject": "Subject",
                  "body": "Body",
              }
              assert _canonical_source_content(base) == _canonical_source_content(dict(base))
              assert _canonical_source_content(base) != _canonical_source_content(
                  {**base, "body": "Different body"}
              )
              assert _canonical_source_content(base) != _canonical_source_content(
                  {**base, "recipients": "one@example.com,two@example.com"}
              )


          @pytest.mark.asyncio
          async def test_missing_date_messages_use_raw_source_not_collection_time(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """Do not merge different raw messages collected at the same instant."""
              session = AsyncMock()
              session.add = MagicMock()
              query_result = MagicMock()
              query_result.scalar_one_or_none.return_value = None
              session.execute.return_value = query_result
              monkeypatch.setattr(
                  "services.imap_worker.assign_thread_id",
                  AsyncMock(side_effect=("thread-first", "thread-second")),
              )
              monkeypatch.setattr(
                  "services.imap_worker.is_self_sent_email",
                  lambda _email, _owners: False,
              )

              collected_at = datetime.datetime(
                  2026, 8, 4, 6, 30, tzinfo=datetime.timezone.utc
              )
              common = {
                  "subject": "Same subject",
                  "date": collected_at,
                  "date_provenance": "missing",
                  "sender": "sender@example.com",
                  "recipients": "recipient@example.com",
                  "message_id": "",
                  "body": "Same parsed body",
              }
              first_source = b"From: sender@example.com\r\n\r\nFirst raw body"
              second_source = b"From: sender@example.com\r\n\r\nSecond raw body"

              await process_fetched_email(
                  session,
                  common,
                  "owner@example.com",
                  "org-acme",
                  source_content=first_source,
              )
              await process_fetched_email(
                  session,
                  common,
                  "owner@example.com",
                  "org-acme",
                  source_content=second_source,
              )

              first_email = session.add.call_args_list[0].args[0]
              second_email = session.add.call_args_list[1].args[0]
              assert first_email.date == collected_at
              assert second_email.date == collected_at
              assert first_email.fingerprint == source_email_fingerprint(first_source)
              assert second_email.fingerprint == source_email_fingerprint(second_source)
              assert first_email.fingerprint != second_email.fingerprint


          @pytest.mark.asyncio
          async def test_direct_caller_without_raw_source_uses_canonical_identity(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """Cover the deterministic parsed-field fallback for direct callers."""
              session = AsyncMock()
              session.add = MagicMock()
              query_result = MagicMock()
              query_result.scalar_one_or_none.return_value = None
              session.execute.return_value = query_result
              monkeypatch.setattr(
                  "services.imap_worker.assign_thread_id",
                  AsyncMock(return_value="thread-canonical"),
              )
              monkeypatch.setattr(
                  "services.imap_worker.is_self_sent_email",
                  lambda _email, _owners: False,
              )
              email_data = {
                  "subject": "Canonical",
                  "date": datetime.datetime(
                      2026, 8, 4, 6, 30, tzinfo=datetime.timezone.utc
                  ),
                  "date_provenance": "invalid",
                  "sender": "sender@example.com",
                  "recipients": ["recipient@example.com"],
                  "message_id": "<canonical@example.com>",
                  "body": "Canonical body",
              }

              created = await process_fetched_email(
                  session,
                  email_data,
                  "owner@example.com",
                  "org-acme",
              )

              assert created.fingerprint == source_email_fingerprint(
                  _canonical_source_content(email_data)
              )


          def test_imap_and_pop3_workers_forward_raw_transport_bytes() -> None:
              """Pin raw-source propagation at both transport boundaries."""
              imap_source = Path("services/imap_worker.py").read_text(encoding="utf-8")
              pop3_source = Path("services/pop3_worker.py").read_text(encoding="utf-8")
              assert "source_content=raw_message" in imap_source
              assert "source_content=raw_message" in pop3_source
          PY

          set +e
          (
            cd backend
            python -m pytest -q tests/test_source_bound_email_dedupe.py
          )
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "::error::Source-bound dedupe regressions unexpectedly passed before remediation."
            exit 1
          fi

      - name: Bind fallback duplicate identity to immutable source content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dedupe_path = Path("backend/services/email_dedupe_service.py")
          text = dedupe_path.read_text(encoding="utf-8")
          if "import hashlib\n" not in text:
              text = text.replace("import datetime\n", "import datetime\nimport hashlib\n", 1)
          helper = '''def source_email_fingerprint(source_content: bytes) -> str:
              """Return a domain-separated SHA-256 identity for immutable source bytes.

              The source key is used when sender-provided Date evidence is missing or
              invalid. Exact re-fetches remain deduplicable, while a synthetic
              collection timestamp can never collapse distinct transport messages.
              """
              digest = hashlib.sha256()
              digest.update(b"naruon-email-source-v1\\0")
              digest.update(source_content)
              return digest.hexdigest()


          '''.replace("          ", "")
          if "def source_email_fingerprint" not in text:
              anchor = "def strong_email_fingerprint(\n"
              if text.count(anchor) != 1:
                  raise SystemExit("strong fingerprint anchor not found exactly once")
              text = text.replace(anchor, helper + anchor, 1)
          dedupe_path.write_text(text, encoding="utf-8")

          import_path = Path("backend/services/email_import_service.py")
          text = import_path.read_text(encoding="utf-8")
          text = text.replace(
              "from services.email_dedupe_service import strong_email_fingerprint\n",
              "from services.email_dedupe_service import (\n"
              "    source_email_fingerprint,\n"
              "    strong_email_fingerprint,\n"
              ")\n",
              1,
          )
          start = text.index("def _email_fingerprint(")
          end = text.index("\n\n\nasync def _find_existing_email", start)
          replacement = '''def _email_fingerprint(
              parsed: EmailData,
              persisted_date: datetime.datetime,
              source_content: bytes,
          ) -> str:
              """Return trusted-Date evidence or an immutable raw-source fallback.

              ``persisted_date`` remains the storage timestamp. It participates in
              automatic deduplication only when the parser proves it came from a valid
              sender ``Date`` header.
              """
              strong_fingerprint = None
              if parsed.get("date_provenance") == "parsed":
                  strong_fingerprint = strong_email_fingerprint(
                      sender=parsed.get("sender"),
                      subject=parsed.get("subject"),
                      date=persisted_date,
                      body=parsed.get("body"),
                  )
              if strong_fingerprint:
                  return strong_fingerprint
              return source_email_fingerprint(source_content)
          '''.replace("          ", "").rstrip()
          text = text[:start] + replacement + text[end:]
          old_call = "    fingerprint = _email_fingerprint(parsed, persisted_date)\n"
          new_call = "    fingerprint = _email_fingerprint(parsed, persisted_date, content)\n"
          if new_call not in text:
              if text.count(old_call) != 1:
                  raise SystemExit("import fingerprint call anchor not found exactly once")
              text = text.replace(old_call, new_call, 1)
          text = text.replace("    generate_email_fingerprint,\n", "", 1)
          import_path.write_text(text, encoding="utf-8")

          imap_path = Path("backend/services/imap_worker.py")
          text = imap_path.read_text(encoding="utf-8")
          if "import json\n" not in text:
              text = text.replace("import datetime\n", "import datetime\nimport json\n", 1)
          text = text.replace(
              "from services.email_dedupe_service import strong_email_fingerprint\n",
              "from services.email_dedupe_service import (\n"
              "    source_email_fingerprint,\n"
              "    strong_email_fingerprint,\n"
              ")\n",
              1,
          )
          text = text.replace(
              "from services.threading_service import assign_thread_id, generate_email_fingerprint\n",
              "from services.threading_service import assign_thread_id\n",
              1,
          )
          process_start = text.index("async def process_fetched_email(")
          process_end = text.index("\nlogger = logging.getLogger(__name__)", process_start)
          process_function = '''def _canonical_source_content(email_data: EmailData) -> bytes:
              """Serialize stable identity fields when transport bytes are unavailable."""
              recipients_value = email_data.get("recipients", [])
              payload = [
                  str(email_data.get("message_id") or ""),
                  str(email_data.get("sender") or ""),
                  recipients_value,
                  str(email_data.get("subject") or ""),
                  str(email_data.get("body") or ""),
              ]
              return json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")


          async def process_fetched_email(
              session,
              email_data: EmailData,
              user_id: str,
              organization_id: str | None,
              owner_addresses: Iterable[str] | None = None,
              is_read: bool = True,
              source_content: bytes | None = None,
          ):
              """Persist one fetched email with provenance-safe duplicate identity."""
              subject = email_data.get("subject", "")
              date_obj = email_data.get("date")
              if isinstance(date_obj, datetime.datetime):
                  persisted_date = (
                      date_obj.astimezone(datetime.timezone.utc)
                      if date_obj.tzinfo is not None
                      else date_obj.replace(tzinfo=datetime.timezone.utc)
                  )
              else:
                  persisted_date = datetime.datetime.now(datetime.timezone.utc)
              sender = email_data.get("sender", "")
              recipients_list = email_data.get("recipients", [])
              recipients = (
                  ",".join(recipients_list)
                  if isinstance(recipients_list, list)
                  else str(recipients_list or "")
              )

              strong_fingerprint = None
              if email_data.get("date_provenance") == "parsed":
                  strong_fingerprint = strong_email_fingerprint(
                      sender=sender,
                      subject=subject,
                      date=persisted_date,
                      body=email_data.get("body", ""),
                  )
              if strong_fingerprint:
                  fingerprint = strong_fingerprint
              else:
                  immutable_source = (
                      source_content
                      if source_content is not None
                      else _canonical_source_content(email_data)
                  )
                  fingerprint = source_email_fingerprint(immutable_source)

              stmt = select(Email).where(
                  Email.user_id == user_id,
                  Email.organization_id == (
                      organization_id if organization_id else None
                  ),
                  Email.fingerprint == fingerprint,
              )
              result = await session.execute(stmt)
              existing_email = result.scalar_one_or_none()
              if existing_email:
                  logger.info(
                      "Email with fingerprint %s already exists. Skipping duplicate insertion.",
                      fingerprint,
                  )
                  return existing_email

              thread_id = await assign_thread_id(
                  session,
                  email_data,
                  user_id=user_id,
                  organization_id=organization_id,
              )
              new_email = Email(
                  user_id=user_id,
                  organization_id=organization_id or None,
                  message_id=email_data.get("message_id", ""),
                  thread_id=thread_id,
                  fingerprint=fingerprint,
                  sender=sender,
                  recipients=recipients,
                  subject=subject,
                  date=persisted_date,
                  date_provenance=email_data.get("date_provenance", "unknown"),
                  body=email_data.get("body", ""),
                  is_read=is_read,
                  embedding=[0.0] * 1536,
              )
              session.add(new_email)
              if is_self_sent_email(new_email, owner_addresses):
                  await session.flush()
                  await extract_knowledge_from_self_sent(
                      session,
                      new_email,
                      owner_addresses,
                  )
              return new_email
          '''.replace("          ", "").rstrip()
          text = text[:process_start] + process_function + text[process_end:]
          import_call = '''                        owner_addresses=owner_addresses,
                              is_read=is_read,
                          )'''.replace("          ", "")
          import_call_with_source = '''                        owner_addresses=owner_addresses,
                              is_read=is_read,
                              source_content=raw_message,
                          )'''.replace("          ", "")
          if import_call_with_source not in text:
              if text.count(import_call) != 1:
                  raise SystemExit("IMAP import call anchor not found exactly once")
              text = text.replace(import_call, import_call_with_source, 1)
          imap_path.write_text(text, encoding="utf-8")

          pop3_path = Path("backend/services/pop3_worker.py")
          text = pop3_path.read_text(encoding="utf-8")
          pop3_call = '''                        owner_addresses=owner_addresses,
                          )'''.replace("          ", "")
          pop3_call_with_source = '''                        owner_addresses=owner_addresses,
                              source_content=raw_message,
                          )'''.replace("          ", "")
          if pop3_call_with_source not in text:
              if text.count(pop3_call) != 1:
                  raise SystemExit("POP3 import call anchor not found exactly once")
              text = text.replace(pop3_call, pop3_call_with_source, 1)
          pop3_path.write_text(text, encoding="utf-8")

          parser_test = Path("backend/tests/test_email_parser_provenance.py")
          text = parser_test.read_text(encoding="utf-8")
          text = text.replace(
              'headers.strip() + "\\n\\nBody text."',
              'headers.strip("\\r\\n") + "\\n\\nBody text."',
              1,
          )
          parser_test.write_text(text, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")
          bullet = (
              "- Date가 없거나 잘못된 이메일의 수집 시각은 저장에만 사용하고, "
              "domain-separated SHA-256 원본-source fingerprint로 정확히 같은 "
              "원본 재수집만 중복 처리합니다. 같은 시각에 수집된 동일 발신자·"
              "제목·수신자의 서로 다른 원문은 자동 병합되지 않습니다.\n"
          )
          if bullet not in text:
              marker = "## [Unreleased]\n"
              if text.count(marker) != 1:
                  raise SystemExit("Unreleased changelog marker not found exactly once")
              text = text.replace(marker, marker + bullet, 1)
          changelog_path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize and verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m ruff check --fix \
            services/email_dedupe_service.py \
            services/email_import_service.py \
            services/imap_worker.py \
            services/pop3_worker.py \
            tests/test_source_bound_email_dedupe.py \
            tests/test_email_parser_provenance.py
          python -m ruff format \
            services/email_dedupe_service.py \
            services/email_import_service.py \
            services/imap_worker.py \
            services/pop3_worker.py \
            tests/test_source_bound_email_dedupe.py \
            tests/test_email_parser_provenance.py
          python -m ruff check \
            services/email_dedupe_service.py \
            services/email_import_service.py \
            services/imap_worker.py \
            services/pop3_worker.py \
            tests/test_source_bound_email_dedupe.py \
            tests/test_email_parser_provenance.py
          python -m ruff format --check \
            services/email_dedupe_service.py \
            services/email_import_service.py \
            services/imap_worker.py \
            services/pop3_worker.py \
            tests/test_source_bound_email_dedupe.py \
            tests/test_email_parser_provenance.py
          python -m pytest -q \
            tests/test_source_bound_email_dedupe.py \
            tests/test_email_import_service.py \
            tests/test_imap_worker.py \
            tests/test_pop3_worker.py \
            tests/test_email_parser_provenance.py \
            tests/test_email_dedupe_service.py \
            tests/test_threading_pipeline.py

      - name: Run complete backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q

      - name: Commit and publish verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            CHANGELOG.md \
            backend/services/email_dedupe_service.py \
            backend/services/email_import_service.py \
            backend/services/imap_worker.py \
            backend/services/pop3_worker.py \
            backend/tests/test_email_parser_provenance.py \
            backend/tests/test_source_bound_email_dedupe.py
          git commit -m "fix(email): bind untrusted-date dedupe to raw source"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
