name: PR 1195 finalizer helper hotfix

on:
  pull_request:
    branches: [develop]
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1195-finalizer-helper-hotfix
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'claude/contextualwisdomlab-audit-governance-qyxe67' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Make empty-string removals idempotent and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr-1195-source-identity-finalize.yml")
          text = path.read_text(encoding="utf-8")
          old = "              if new in text:\n                  return text\n"
          new = "              if new and new in text:\n                  return text\n"
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one finalizer helper anchor, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/pr-1195-finalizer-helper-hotfix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pr-1195-source-identity-finalize.yml \
            .github/workflows/pr-1195-finalizer-helper-hotfix.yml
          if git diff --cached --quiet; then
            echo "No hotfix changes remain to publish."
            exit 0
          fi
          git commit -m "fix(ci): handle empty finalizer replacements"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
