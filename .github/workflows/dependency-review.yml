name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - master
      - "release/**"
  workflow_dispatch:

# GitHub reusable workflows cannot elevate GITHUB_TOKEN permissions through
# the call chain -- the called workflow's own permissions: block is only a
# ceiling. Without an explicit grant here, this job runs with the repo's
# broader default token permissions instead of the minimal read-only set
# the central workflow actually needs (CodeQL: workflow does not contain
# permissions).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    uses: ContextualWisdomLab/.github/.github/workflows/dependency-review.yml@5f8e5b2a79e709c4ab1a4179a605d34c458b13a1
    with:
      fail_on_severity: moderate
      comment_summary_in_pr: never
