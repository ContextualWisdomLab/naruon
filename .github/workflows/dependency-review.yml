name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    uses: ContextualWisdomLab/.github/.github/workflows/dependency-review.yml@58d12a9f1b46d611f75cfcf3e6c5a3fe19a55f96 # v5.0.0 dependency-review-action supplier
    with:
      fail_on_severity: moderate
      allow_ghsas: ""
      continue_on_error: false
      comment_summary_in_pr: never
