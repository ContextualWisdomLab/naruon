## Decision

The email detail view exposes participants and attachment names at every viewport
size. Attachments use a horizontally scrollable `role=region` landmark with the
accessible name `첨부파일`, so a small viewport does not silently remove source
evidence and assistive-technology users can navigate to it directly.

The meeting-conflict panel reuses the existing calendar writeback-intent boundary
rather than rendering an inert call-to-action. It loads only server-authorized
writable source records, requires the user to confirm one opaque
`target_source_id`, and sends that identifier with every action-item intent. The
client never asks the backend to choose an account implicitly. A server conflict
or target mismatch clears the selection and requires a new confirmation while
preserving server-returned provider provenance in the success status.

Unrelated backend changes are excluded from this UI slice. Thread identifier,
SMTP destination, import-format, and tenant-scope policy changes require their
own security rationale and regression contracts rather than hitchhiking on a
presentation PR.

## Accessibility and integrity boundary

The implementation preserves native button and select semantics, the
repository's keyboard-visible focus system, the named attachment landmark, and
asynchronous status through `role=status` and `aria-live=polite`. Loading, empty
source, absent action-item, pending request, authorization failure, unavailable
target, and `409 Conflict` paths fail closed without automatic account fallback.
WCAG 2.2 is the normative accessibility target. The focused regression proves
DOM discoverability and activation, but this record does not claim full WCAG
conformance without contrast, zoom, assistive-technology, and manual usability
evidence.

## Verification contract

- The participant list renders without an unsafe type assertion.
- The attachment rail is a visible, horizontally scrollable region named
  `첨부파일`.
- The scheduling action remains disabled with no action item, no confirmed
  writable source, a source-registry error, or an in-flight request.
- Activating the action sends the exact server-authorized
  `target_source_id` with every writeback intent.
- A pending request exposes the loading label and disabled state.
- A `409` response clears the source and reports an explicit conflict rather
  than allowing automatic source selection.
- Successful intent creation preserves server-provided source provenance in a
  polite live status.
- The three unrelated backend files remain byte-identical to the exact PR base.
- Focused and complete frontend tests, lint, type checking, production coverage,
  and the production build run before the verified commit is published.

## References

World Wide Web Consortium. (2023). *Web Content Accessibility Guidelines
(WCAG) 2.2*. https://www.w3.org/TR/WCAG22/

World Wide Web Consortium. (n.d.). *Understanding success criterion 2.4.7:
Focus visible*. Retrieved August 5, 2026, from
https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html

