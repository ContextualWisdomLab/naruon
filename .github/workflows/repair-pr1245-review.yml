name: Repair PR 1245 review findings

on:
  push:
    branches:
      - fix/email-detail-responsive-surface-maintainer
    paths:
      - .github/workflows/repair-pr1245-review.yml

permissions:
  contents: write

concurrency:
  group: repair-pr1245-review
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/naruon' &&
      github.ref == 'refs/heads/fix/email-detail-responsive-surface-maintainer'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable repair parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "8f7ff8b164de60af321b81f78c024fd7996b95aa"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install pnpm
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Add the review regressions first
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
