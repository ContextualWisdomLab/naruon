          text = path.read_text(encoding="utf-8")
          start_marker = '  it("renders responsive participant and attachment evidence and executes the meeting action", async () => {'
          start = text.index(start_marker)
          end_marker = "\n  });\n});"
          end = text.index(end_marker, start) + len("\n  });")
          replacement = r'''  it("renders responsive participant and attachment evidence and executes the selected-source meeting action", async () => {
