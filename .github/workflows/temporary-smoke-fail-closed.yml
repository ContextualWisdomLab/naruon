name: Temporary smoke fail-closed repair

on:
  push:
    branches:
      - codex/smoke-late-error-guard

permissions:
  contents: write

jobs:
  repair:
    name: Repair fail-open mocked API boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Verify single-writer head
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Apply fail-closed route-mock repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("frontend/scripts/full-product-ui-smoke.mjs")
          test_path = Path("frontend/scripts/full-product-ui-smoke.test.mjs")
          source = source_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "async function installRoutes(page) {",
                  "async function installRoutes(page, unhandledApiRequests = new Set()) {",
              ),
              (
                  "    return routeJson(route, { ok: true });\n",
                  "    unhandledApiRequests.add(`${request.method()} ${endpoint}`);\n"
                  "    return route.abort(\"failed\");\n",
              ),
              (
                  "  const consoleErrors = [];\n  let screenshotArtifact;",
                  "  const consoleErrors = [];\n  const unhandledApiRequests = new Set();\n  let screenshotArtifact;",
              ),
              (
                  "    await installRoutes(page);",
                  "    await installRoutes(page, unhandledApiRequests);",
              ),
              (
                  "  if (consoleErrors.length > 0) {\n    throw new Error(`Route ${routeSpec.path} emitted console errors:\\n${consoleErrors.join(\"\\n\")}`);\n  }\n  return { screenshotPath: screenshotArtifact, interactionEvidence, accessibilityEvidence };",
                  "  if (unhandledApiRequests.size > 0) {\n"
                  "    throw new Error(\n"
                  "      `Route ${routeSpec.path} requested unregistered mocked APIs:\\n${[...unhandledApiRequests].join(\"\\n\")}`,\n"
                  "    );\n"
                  "  }\n"
                  "  if (consoleErrors.length > 0) {\n"
                  "    throw new Error(`Route ${routeSpec.path} emitted console errors:\\n${consoleErrors.join(\"\\n\")}`);\n"
                  "  }\n"
                  "  return { screenshotPath: screenshotArtifact, interactionEvidence, accessibilityEvidence };",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          marker = 'describe("route smoke late browser errors", () => {'
          if tests.count(marker) != 1:
              raise SystemExit("route-smoke test insertion marker changed")

          regression = r'''describe("route smoke API fixture boundary", () => {
  it("fails closed when the product requests an unregistered mocked API", async () => {
    let apiRouteHandler;
    let abortReason;
    let evaluationCount = 0;
    const page = {
      on: () => {},
      route: async (pattern, handler) => {
        if (pattern === "**/api/**") apiRouteHandler = handler;
      },
      goto: async () => {
        expect(apiRouteHandler).toBeTypeOf("function");
        await apiRouteHandler({
          request: () => ({
            url: () => "http://127.0.0.1:3001/api/unregistered-smoke-endpoint",
            method: () => "GET",
          }),
          abort: async (reason) => {
            abortReason = reason;
          },
        });
      },
      waitForLoadState: async () => {},
      locator: () => ({ waitFor: async () => {}, innerText: async () => "Naruon" }),
      evaluate: async () => {
        evaluationCount += 1;
        if (evaluationCount === 1) return { duplicateIds: [], unnamedInteractive: [] };
        return { tagName: "BUTTON" };
      },
      keyboard: { press: async () => {} },
      screenshot: async () => {},
      close: async () => {},
    };

    await expect(runRouteSmoke(
      { newPage: async () => page },
      FULL_PRODUCT_ROUTES[0],
      { name: "desktop", width: 1440, height: 1024 },
      1,
      path.join(tmpdir(), "naruon-full-product-smoke-unit"),
    )).rejects.toThrow("GET /api/unregistered-smoke-endpoint");
    expect(abortReason).toBe("failed");
  });
});

'''
          tests = tests.replace(marker, regression + marker, 1)

          source_path.write_text(source, encoding="utf-8")
          test_path.write_text(tests, encoding="utf-8")
          PY

          git diff --check
          git diff --name-only | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          frontend/scripts/full-product-ui-smoke.mjs
          frontend/scripts/full-product-ui-smoke.test.mjs
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run focused regression and lint
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec vitest run scripts/full-product-ui-smoke.test.mjs
          pnpm exec eslint scripts/full-product-ui-smoke.mjs scripts/full-product-ui-smoke.test.mjs --max-warnings 0

      - name: Commit and push product delta non-force
        shell: bash
        env:
          BRANCH_NAME: codex/smoke-late-error-guard
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            echo "Remote head moved: expected ${GITHUB_SHA}, got ${remote_head}" >&2
            exit 1
          fi

          git add -- frontend/scripts/full-product-ui-smoke.mjs frontend/scripts/full-product-ui-smoke.test.mjs
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual-staged-paths
          cat > /tmp/expected-staged-paths <<'EOF'
          frontend/scripts/full-product-ui-smoke.mjs
          frontend/scripts/full-product-ui-smoke.test.mjs
          EOF
          sed -i 's/^          //' /tmp/expected-staged-paths
          diff -u /tmp/expected-staged-paths /tmp/actual-staged-paths

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(smoke): fail closed on unregistered mocked APIs"
          git push origin "HEAD:${BRANCH_NAME}"
