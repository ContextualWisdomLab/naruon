name: Refresh Email Writing Contracts Parent

on:
  push:
    branches:
      - feat/llm-email-writing-contracts-task2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-email-writing-contracts-parent
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error
  DISABLE_BACKGROUND_WORKERS: "1"

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/llm-email-writing-contracts-task2
          persist-credentials: true
          fetch-depth: 0
      - name: Merge the current Task 1 parent
        run: |
          set -euo pipefail
          git fetch origin feat/inkspan-email-writing-guide
          git config user.name "CWL Email Writing Task 2 Refresh"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit --no-ff origin/feat/inkspan-email-writing-guide
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - name: Install hash-locked backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Verify backend contracts
        run: |
          cd backend
          python -m pytest -q \
            tests/test_email_writing_contracts.py \
            tests/test_email_writing_contracts_coverage.py \
            tests/test_email_writing_contracts_terminal_coverage.py
          python -m ruff check \
            services/email_writing_contracts.py \
            tests/test_email_writing_contracts.py \
            tests/test_email_writing_contracts_coverage.py \
            tests/test_email_writing_contracts_terminal_coverage.py
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Verify frontend contracts
        run: |
          cd frontend
          pnpm exec vitest run \
            src/lib/email-writing.test.ts \
            src/lib/email-writing.coverage.test.ts \
            src/lib/email-writing.parser-coverage.test.ts
          pnpm typecheck
      - name: Remove one-shot workflow and publish refresh
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-email-writing-contracts-parent.yml
          git diff --check
          git add .github/workflows/refresh-email-writing-contracts-parent.yml
          git commit -m "ci(email-writing): remove Task 2 parent refresh workflow"
          git push origin HEAD:feat/llm-email-writing-contracts-task2
