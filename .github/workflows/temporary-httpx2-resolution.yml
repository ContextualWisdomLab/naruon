name: Temporary httpx2 owner adoption

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: httpx2-owner-adoption-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  adopt:
    if: >-
      github.head_ref == 'codex/starlette-testclient-dependency' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned resolver
        run: python -m pip install --disable-pip-version-check 'uv==0.10.0'

      - name: Reproduce and verify exact resolver output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in (Path('backend/requirements.txt'), Path('backend/pyproject.toml')):
              text = path.read_text(encoding='utf-8')
              old = 'httpx2==2.5.0'
              assert text.count(old) == 1, (path, text.count(old))
              path.write_text(text.replace(old, 'httpx2==2.12.0'), encoding='utf-8')
          PY
          (
            cd backend
            uv lock --upgrade-package 'httpx2==2.12.0'
          )
          uv pip compile \
            --generate-hashes \
            --python-version 3.14 \
            --python-platform x86_64-unknown-linux-gnu \
            --output-file backend/requirements-hashes.txt \
            backend/requirements.txt
          mkdir -p .resolver-evidence
          sha256sum \
            backend/requirements.txt \
            backend/pyproject.toml \
            backend/requirements-hashes.txt \
            backend/uv.lock \
            > .resolver-evidence/sha256.txt
          cat > .resolver-evidence/expected-sha256.txt <<'EOF'
          a0bbed543860fe2dff63e1a7ddd96b9b843a12acd7c4838b123a21c97967a22d  backend/requirements.txt
          58b89778097bc23f9bad06bdeb4a1207f7f304edd58bb168782600b5c8379fdb  backend/pyproject.toml
          2870d4f4af934b41e9dcdb769be3ce373c11e7bb58473163277a00cd432cae19  backend/requirements-hashes.txt
          d6a249e3a22a3e9130cee5992f31c5a3ecc13d38898dbfa11684fdfb0be467d5  backend/uv.lock
          EOF
          diff -u .resolver-evidence/expected-sha256.txt .resolver-evidence/sha256.txt
          git diff --check

      - name: Update contract tests and traceability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('backend/tests/test_container_dependency_pin_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          replacements = {
              'backend_pins["httpx2"] == "2.5.0"': 'backend_pins["httpx2"] == "2.12.0"',
              '"httpx2==2.5.0" in backend_records': '"httpx2==2.12.0" in backend_records',
              '            "httpx2==2.5.0",': '            "httpx2==2.12.0",',
          }
          for old, new in replacements.items():
              assert test_text.count(old) == 1, (old, test_text.count(old))
              test_text = test_text.replace(old, new)
          test_path.write_text(test_text, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          old_line = '- Starlette `TestClient`의 기존 `httpx2==2.5.0` pin을 core 개발·테스트 의존성으로 승격하고, deprecated `httpx` fallback 경고 억제를 제거했습니다.'
          new_line = '- Starlette `TestClient`의 preferred transport를 `httpx2==2.12.0`으로 고정하고, resolver가 선택한 `httpcore2==2.12.0`과 hash/uv lock을 함께 갱신했습니다. deprecated `httpx` fallback 경고 억제는 제거된 상태를 유지합니다.'
          assert changelog.count(old_line) == 1, changelog.count(old_line)
          changelog_path.write_text(changelog.replace(old_line, new_line), encoding='utf-8')

          doctoring = '''# Starlette TestClient `httpx2` dependency

## Observed failure

Protected `develop@042b0c70531b229af3acbd0421a2f23098d848b3` pins Starlette
1.3.1 but did not install `httpx2`. Importing `starlette.testclient` therefore
fell back to deprecated `httpx`; warning-as-error test runs stopped during
collection. Removing the warning filter without installing the preferred
transport would expose the defect without repairing it.

The first owner repair pinned `httpx2==2.5.0`, but hosted Security then reported
that direct version and its resolved `httpcore2==2.5.0` as vulnerable. The
owner therefore had to regenerate the dependency graph rather than suppress the
scanner or hand-edit generated lock data.

## Decision and boundary

Pin `httpx2==2.12.0` in the repository's existing combined backend
development/direct-test manifests and immutable locks. Keep application HTTP
clients on their existing `httpx` path. The resolver-generated graph selects
`httpcore2==2.12.0`; a runtime regression test still imports Starlette's
TestClient module and verifies that its selected transport module is `httpx2`.
Manifest and digest checks alone are insufficient evidence.

Read-only resolver run `35788211863` on owner exact
`1ceb2f40b8a62dc4c2084ab674cbac5bbbe09591` reproduced the accepted candidate
with Python 3.14 and `uv==0.10.0`. Artifact `10724734967` retained the exact
manifests, generated hash lock, `uv.lock`, binary diff and SHA-256 manifest.
Before adoption, all four artifact files were re-hashed and matched that
manifest. The generated wheel record for `httpx2==2.12.0` carries SHA-256
`cc8b6eecb8661c146b8f89a60e97456ee086e91a784ed31ac450c3a9e613dd36`.

This owner only repairs the Starlette TestClient development/test dependency.
Inherited frontend findings remain in the dependency-security owner; this PR
does not broaden into application HTTP client migration or frontend packages.

## Verification and rollback

Run from `backend/`:

```bash
uv lock --check
uv sync --frozen --group dev
uv run --frozen pytest -q -W error tests/test_container_dependency_pin_contract.py
uv run --frozen ruff check tests/test_container_dependency_pin_contract.py
```

Rollback removes the direct pin, regenerated lock records, runtime assertion,
and obsolete-warning-filter removal together. Do not restore only the warning
suppression. Any rollback must regenerate the lock/hash set rather than editing
those files manually.

## References

Kludex. (2026). *Starlette release notes*. GitHub.
https://github.com/Kludex/starlette/blob/main/docs/release-notes.md

Python Packaging Authority. (2026). *httpx2 2.12.0* [Python package]. PyPI.
https://pypi.org/project/httpx2/2.12.0/

Pydantic. (2026). *HTTPX2 v2.12.0* [Source code]. GitHub.
https://github.com/pydantic/httpx2/tree/v2.12.0
'''
          Path('docs/doctoring/starlette-httpx2-testclient-dependency.md').write_text(
              doctoring,
              encoding='utf-8',
          )
          PY

      - name: Remove completed helper and validate bounded delta
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-httpx2-resolution.yml
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/temporary-httpx2-resolution.yml',
              'CHANGELOG.md',
              'backend/pyproject.toml',
              'backend/requirements-hashes.txt',
              'backend/requirements.txt',
              'backend/tests/test_container_dependency_pin_contract.py',
              'backend/uv.lock',
              'docs/doctoring/starlette-httpx2-testclient-dependency.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD'], text=True
          ).splitlines())
          assert changed == expected, (sorted(changed), sorted(expected))
          PY

      - name: Focused exact-graph verification
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend
            uv lock --check
            uv sync --frozen --group dev
            uv run --frozen pytest -q -W error tests/test_container_dependency_pin_contract.py
            uv run --frozen ruff check tests/test_container_dependency_pin_contract.py
          )

      - name: Commit exact owner repair without overwriting concurrent work
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_HEAD_REF}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(deps): adopt verified httpx2 2.12.0 graph'
          git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
