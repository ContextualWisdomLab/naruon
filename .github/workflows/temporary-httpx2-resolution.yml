name: Temporary httpx2 lock resolution

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'codex/starlette-testclient-dependency'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned resolver
        run: python -m pip install --disable-pip-version-check 'uv==0.10.0'

      - name: Resolve secure TestClient dependency without writing repository history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in (Path('backend/requirements.txt'), Path('backend/pyproject.toml')):
              text = path.read_text()
              old = 'httpx2==2.5.0'
              assert text.count(old) == 1, (path, text.count(old))
              path.write_text(text.replace(old, 'httpx2==2.12.0'))
          PY
          (
            cd backend
            uv lock --upgrade-package 'httpx2==2.12.0'
          )
          uv pip compile \
            --generate-hashes \
            --python-version 3.14 \
            --python-platform x86_64-unknown-linux-gnu \
            --output-file backend/requirements-hashes.txt \
            backend/requirements.txt
          git diff --check
          mkdir -p .resolver-evidence
          git diff --binary -- \
            backend/requirements.txt \
            backend/pyproject.toml \
            backend/requirements-hashes.txt \
            backend/uv.lock \
            > .resolver-evidence/generated.diff
          sha256sum \
            backend/requirements.txt \
            backend/pyproject.toml \
            backend/requirements-hashes.txt \
            backend/uv.lock \
            | tee .resolver-evidence/sha256.txt
          echo '=== GENERATED HTTPX2 RESOLUTION DIFF START ==='
          cat .resolver-evidence/generated.diff
          echo '=== GENERATED HTTPX2 RESOLUTION DIFF END ==='

      - name: Upload exact generated resolver evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: httpx2-resolution-${{ github.event.pull_request.head.sha }}
          path: |
            backend/requirements.txt
            backend/pyproject.toml
            backend/requirements-hashes.txt
            backend/uv.lock
            .resolver-evidence/generated.diff
            .resolver-evidence/sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
