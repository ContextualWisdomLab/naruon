name: Temporary NetworkGraph canonical restack

on:
  push:
    branches:
      - bolt/optimize-array-slice-3666027770931613290

permissions:
  contents: write

jobs:
  restack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build bounded canonical successor
        shell: bash
        env:
          PROTECTED_SHA: 042b0c70531b229af3acbd0421a2f23098d848b3
          GENERATED_SHA: 0416e97112c93525dbbae85a572d5ae2edb86d68
          OWNER_SHA: 157894a526165005e686f81c1f7b7a14c39f1973
          BRANCH_NAME: bolt/optimize-array-slice-3666027770931613290
        run: |
          set -euo pipefail

          staging_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse "${staging_sha}^")" = "$GENERATED_SHA"
          git cat-file -e "${OWNER_SHA}^{commit}"

          work_root="$(mktemp -d)"
          trap 'git worktree remove --force "$work_root/work" >/dev/null 2>&1 || true; rm -rf "$work_root"' EXIT

          git diff --binary "$PROTECTED_SHA" "$GENERATED_SHA" -- frontend/src/components/NetworkGraph.tsx > "$work_root/generated.patch"
          git worktree add --detach "$work_root/work" "$OWNER_SHA"

          cd "$work_root/work"
          git apply --3way "$work_root/generated.patch"

          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/NetworkGraph.tsx")
          drop = (
              "⚡ Bolt Optimization",
              "This prevents allocating",
              "Achieves O(1)",
              "Bounded early-exit iteration",
              "Prevents full array allocation",
          )
          lines = path.read_text().splitlines()
          path.write_text("\n".join(line for line in lines if not any(marker in line for marker in drop)) + "\n")
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/NetworkGraph.test.tsx")
          text = path.read_text()
          marker = "\n});\n"
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit("NetworkGraph describe terminator not found")

          test = r'''

            it("limits summary and selector options without reordering graph data", async () => {
              const nodes = [
                { id: null, label: "" },
                ...Array.from({ length: 10 }, (_, index) => ({
                  id: `node-${index + 1}`,
                  label: `노드 ${index + 1}`,
                })),
              ];
              const edges = Array.from({ length: 7 }, (_, index) => ({
                id: `edge-${index + 1}`,
                from: `node-${index + 1}`,
                to: `node-${index + 2}`,
                title: `관계 ${index + 1}`,
              }));
              const fetchMock = vi.fn(() => Promise.resolve(jsonResponse({ nodes, edges })));
              vi.stubGlobal("fetch", fetchMock);

              await renderGraph();
              await flushAsyncWork();

              const mountedContainer = getMountedContainer();
              const summary = Array.from(mountedContainer.querySelectorAll("p")).find((element) =>
                element.textContent?.startsWith("관련 노드:"),
              );
              expect(summary?.textContent).toBe(
                "관련 노드: 노드 1, 노드 2, 노드 3, 노드 4, 노드 5",
              );

              const relationshipSelect = mountedContainer.querySelector(
                'select[aria-label="관계 선택"]',
              );
              expect(relationshipSelect).toBeInstanceOf(HTMLSelectElement);
              const relationshipOptions = Array.from(
                (relationshipSelect as HTMLSelectElement).options,
              ).slice(1);
              expect(relationshipOptions.map((option) => option.value)).toEqual([
                "edge-1",
                "edge-2",
                "edge-3",
                "edge-4",
                "edge-5",
              ]);
              expect(relationshipOptions.map((option) => option.textContent)).toEqual([
                "관계 1: 노드 1 -> 노드 2 (관계 1)",
                "관계 2: 노드 2 -> 노드 3 (관계 2)",
                "관계 3: 노드 3 -> 노드 4 (관계 3)",
                "관계 4: 노드 4 -> 노드 5 (관계 4)",
                "관계 5: 노드 5 -> 노드 6 (관계 5)",
              ]);

              const nodeSelect = mountedContainer.querySelector('select[aria-label="노드 선택"]');
              expect(nodeSelect).toBeInstanceOf(HTMLSelectElement);
              const nodeOptions = Array.from((nodeSelect as HTMLSelectElement).options).slice(1);
              expect(nodeOptions.map((option) => option.value)).toEqual([
                "node-1",
                "node-2",
                "node-3",
                "node-4",
                "node-5",
                "node-6",
                "node-7",
                "node-8",
              ]);
              expect(nodeOptions.map((option) => option.textContent)).toEqual([
                "노드: 노드 1",
                "노드: 노드 2",
                "노드: 노드 3",
                "노드: 노드 4",
                "노드: 노드 5",
                "노드: 노드 6",
                "노드: 노드 7",
                "노드: 노드 8",
              ]);
            });
          '''
          path.write_text(text[:index] + test + text[index:])
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          old = "- **Frontend**: NetworkGraph 컴포넌트에 `React.memo()`를 적용하여 불필요한 렌더링을 방지하는 성능 최적화를 적용했습니다."
          new = "- **Frontend**: NetworkGraph에 `React.memo()`를 적용하고 관계·노드 선택 목록은 화면에 필요한 개수까지만 순회해, 부모 재렌더와 대규모 그래프의 불필요한 목록 할당을 줄였습니다."
          if old not in text:
              raise SystemExit("NetworkGraph changelog anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY

          corepack enable pnpm
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec vitest run \
            src/components/NetworkGraph.test.tsx \
            src/components/NetworkGraph.memoization.test.tsx
          pnpm --dir frontend exec eslint \
            src/components/NetworkGraph.tsx \
            src/components/NetworkGraph.test.tsx \
            src/components/NetworkGraph.memoization.test.tsx \
            --max-warnings 0

          mkdir -p .github/workflows
          git show "${staging_sha}:.github/workflows/temporary-networkgraph-restack.yml" \
            > .github/workflows/temporary-networkgraph-restack.yml

          git add \
            .github/workflows/temporary-networkgraph-restack.yml \
            CHANGELOG.md \
            frontend/src/components/NetworkGraph.tsx \
            frontend/src/components/NetworkGraph.test.tsx

          export GIT_AUTHOR_NAME="CWL Naruon Automation"
          export GIT_AUTHOR_EMAIL="actions@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          tree_sha="$(git write-tree)"
          product_sha="$(printf '%s\n' 'perf(frontend): restack bounded NetworkGraph iteration' | git commit-tree "$tree_sha" -p "$staging_sha" -p "$OWNER_SHA")"

          git merge-base --is-ancestor "$staging_sha" "$product_sha"
          git merge-base --is-ancestor "$OWNER_SHA" "$product_sha"

          changed="$(git diff --name-only "$OWNER_SHA" "$product_sha")"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx 'CHANGELOG.md'
          printf '%s\n' "$changed" | grep -Fx 'frontend/src/components/NetworkGraph.tsx'
          printf '%s\n' "$changed" | grep -Fx 'frontend/src/components/NetworkGraph.test.tsx'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/temporary-networkgraph-restack.yml'

          git push origin "$product_sha:refs/heads/$BRANCH_NAME"
