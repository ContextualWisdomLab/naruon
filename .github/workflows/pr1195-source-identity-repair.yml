name: PR 1195 source identity repair

on:
  push:
    branches:
      - claude/contextualwisdomlab-audit-governance-qyxe67
    paths:
      - .github/workflows/pr1195-source-identity-repair.yml

concurrency:
  group: pr1195-source-identity-repair
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair:
    if: ${{ github.repository == 'ContextualWisdomLab/naruon' && github.ref == 'refs/heads/claude/contextualwisdomlab-audit-governance-qyxe67' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden runner with blocking egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install hash-locked backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r backend/requirements-hashes.txt

      - name: Prove source-bound regressions fail before implementation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          (
            cd backend
            python -m pytest -q tests/test_source_bound_email_dedupe.py
          ) >"${RUNNER_TEMP}/pr1195-red.log" 2>&1
          red_status=$?
          set -e
          cat "${RUNNER_TEMP}/pr1195-red.log"
          if [ "$red_status" -eq 0 ]; then
            echo "::error::Source-bound regressions unexpectedly passed before implementation."
            exit 1
          fi
          grep -F "canonical_email_source_content" "${RUNNER_TEMP}/pr1195-red.log"

      - name: Apply source-bound fallback identity
        run: python scripts/ci/pr1195_source_identity_repair.py

      - name: Restore RFC 1939 CRLF in POP3 RETR source bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/services/pop3_worker.py")
          text = path.read_text(encoding="utf-8")
          old_call = '                messages.append(b"\\r\\n".join(self._bytes_line(line) for line in lines))\n'
          new_call = '                messages.append(self._message_bytes(lines))\n'
          helper = '''    def _message_bytes(self, lines: list[bytes | str]) -> bytes:\n        """Reconstruct one POP3 RETR message with protocol CRLF terminators.\n\n        ``poplib`` removes line terminators from the multiline response while\n        RFC 1939 defines each transferred message line as CRLF-terminated.\n        """\n        return b"\\r\\n".join(self._bytes_line(line) for line in lines) + b"\\r\\n"\n\n'''
          anchor = '    def _message_number_from_listing(self, listing: bytes | str) -> int | None:\n'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit("POP3 RETR reconstruction call anchor not found")
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("POP3 message-byte helper anchor not found")
              text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify realistic email pipelines and full backend suite
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m ruff format backend/services/email_dedupe_service.py backend/services/email_import_service.py backend/services/imap_worker.py backend/services/pop3_worker.py backend/tests/test_source_bound_email_dedupe.py backend/tests/test_email_parser_provenance.py backend/tests/test_imap_worker.py backend/tests/test_pop3_worker.py
          python -m ruff check backend
          (
            cd backend
            python -m pytest -q tests/test_source_bound_email_dedupe.py tests/test_email_parser_provenance.py tests/test_email_dedupe_service.py tests/test_email_import_service.py tests/test_imap_worker.py tests/test_pop3_worker.py
            python -m pytest -q
          )
          git diff --check

      - name: Publish verified current-head remediation
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/pr1195-source-identity-repair.yml scripts/ci/pr1195_source_identity_repair.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md backend/services/email_dedupe_service.py backend/services/email_import_service.py backend/services/imap_worker.py backend/services/pop3_worker.py backend/tests/test_source_bound_email_dedupe.py backend/tests/test_email_parser_provenance.py backend/tests/test_imap_worker.py backend/tests/test_pop3_worker.py .github/workflows/pr1195-source-identity-repair.yml scripts/ci/pr1195_source_identity_repair.py
          git commit -m "fix(email): bind fallback dedupe to immutable source"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:claude/contextualwisdomlab-audit-governance-qyxe67"
