name: PR 1195 source identity repair

on:
  push:
    branches:
      - claude/contextualwisdomlab-audit-governance-qyxe67
    paths:
      - .github/workflows/pr1195-source-identity-repair.yml

concurrency:
  group: pr1195-source-identity-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    if: ${{ github.repository == 'ContextualWisdomLab/naruon' && github.ref == 'refs/heads/claude/contextualwisdomlab-audit-governance-qyxe67' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout exact pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install hash-locked backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r backend/requirements-hashes.txt

      - name: Prove source-bound regressions fail before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (
            cd backend
            python -m pytest -q tests/test_source_bound_email_dedupe.py
          )
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "::error::Source-bound regressions unexpectedly passed before implementation."
            exit 1
          fi

      - name: Apply source-bound fallback identity
        run: python scripts/ci/pr1195_source_identity_repair.py

      - name: Verify realistic email pipelines and full backend suite
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format backend/services/email_dedupe_service.py backend/services/email_import_service.py backend/services/imap_worker.py backend/services/pop3_worker.py backend/tests/test_source_bound_email_dedupe.py backend/tests/test_email_parser_provenance.py backend/tests/test_imap_worker.py backend/tests/test_pop3_worker.py
          python -m ruff check backend
          (
            cd backend
            python -m pytest -q tests/test_source_bound_email_dedupe.py tests/test_email_parser_provenance.py tests/test_email_dedupe_service.py tests/test_email_import_service.py tests/test_imap_worker.py tests/test_pop3_worker.py
            python -m pytest -q
          )
          git diff --check

      - name: Publish verified current-head remediation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1195-source-identity-repair.yml scripts/ci/pr1195_source_identity_repair.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md backend/services/email_dedupe_service.py backend/services/email_import_service.py backend/services/imap_worker.py backend/services/pop3_worker.py backend/tests/test_source_bound_email_dedupe.py backend/tests/test_email_parser_provenance.py backend/tests/test_imap_worker.py backend/tests/test_pop3_worker.py .github/workflows/pr1195-source-identity-repair.yml scripts/ci/pr1195_source_identity_repair.py
          git commit -m "fix(email): bind fallback dedupe to immutable source"
          git push origin HEAD:claude/contextualwisdomlab-audit-governance-qyxe67
