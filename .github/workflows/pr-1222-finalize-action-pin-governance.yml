name: PR 1222 finalize exact action-pin governance

on:
  push:
    branches:
      - dependabot/github_actions/github-actions-f2ccb4ebe5
    paths:
      - .github/workflows/pr-1222-finalize-action-pin-governance.yml

concurrency:
  group: pr-1222-finalize-action-pin-governance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/github_actions/github-actions-f2ccb4ebe5
          fetch-depth: 0
          persist-credentials: true

      - name: Add exact action-pin governance assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_release_governance.py")
          source = path.read_text(encoding="utf-8")
          marker = "def test_updated_github_action_pins_are_exact_and_annotated() -> None:"
          if marker in source:
              raise SystemExit("Exact action-pin governance test already exists")

          addition = r'''


def test_updated_github_action_pins_are_exact_and_annotated() -> None:
    """Bind every action updated by the grouped dependency PR to its release SHA."""
    expected_references = {
        "actions/checkout": (
            "3d3c42e5aac5ba805825da76410c181273ba90b1",
            "v7.0.1",
            (
                ".github/workflows/app-ci.yml",
                ".github/workflows/bandit.yml",
                ".github/workflows/dependency-review.yml",
                ".github/workflows/deploy.yml",
                ".github/workflows/docker-publish.yml",
                ".github/workflows/mail-smoke.yml",
            ),
        ),
        "actions/setup-python": (
            "5fda3b95a4ea91299a34e894583c3862153e4b97",
            "v7.0.0",
            (
                ".github/workflows/app-ci.yml",
                ".github/workflows/bandit.yml",
                ".github/workflows/mail-smoke.yml",
            ),
        ),
        "actions/setup-node": (
            "820762786026740c76f36085b0efc47a31fe5020",
            "v7.0.0",
            (".github/workflows/app-ci.yml",),
        ),
        "github/codeql-action/upload-sarif": (
            "f205ea1c3313d32999d8d6a48b4f6530d4437b38",
            "v4.37.4",
            (".github/workflows/bandit.yml",),
        ),
        "docker/login-action": (
            "dbcb813823bdd20940b903addbd779551569679f",
            "v4.6.0",
            (".github/workflows/docker-publish.yml",),
        ),
    }

    for action_name, (commit_sha, release_tag, workflow_paths) in (
        expected_references.items()
    ):
        expected_reference = f"{action_name}@{commit_sha} # {release_tag}"
        for workflow_path in workflow_paths:
            workflow = read_repo_text(workflow_path)
            assert expected_reference in workflow, (
                f"{workflow_path} must use {expected_reference}"
            )
            for line in workflow.splitlines():
                if f"uses: {action_name}@" in line:
                    assert expected_reference in line, (
                        f"{workflow_path} has a mismatched {action_name} SHA/comment: "
                        f"{line.strip()}"
                    )
'''
          path.write_text(source.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Verify exact governance source
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
          python -m ruff check backend/tests/test_release_governance.py
          python -m pytest backend/tests/test_release_governance.py -q
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
          python -m compileall -q backend/tests/test_release_governance.py
          git diff --check

      - name: Commit only verified permanent changes and remove this workflow
        run: |
          rm .github/workflows/pr-1222-finalize-action-pin-governance.yml
          git diff --check
          test "$(git status --short | wc -l)" -eq 2
          git status --short | grep -F ' M backend/tests/test_release_governance.py'
          git status --short | grep -F ' D .github/workflows/pr-1222-finalize-action-pin-governance.yml'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- backend/tests/test_release_governance.py .github/workflows/pr-1222-finalize-action-pin-governance.yml
          git diff --cached --check
          git commit -m "test(governance): bind grouped action release pins"
          git push origin HEAD:dependabot/github_actions/github-actions-f2ccb4ebe5

# Exact-head repair trigger; the workflow deletes itself after verified publication.
