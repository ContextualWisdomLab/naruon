name: Temporary Search E2E owner repair

on:
  push:
    branches:
      - codex/search-customer-copy

permissions:
  contents: write

concurrency:
  group: temporary-search-e2e-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/naruon' && github.ref == 'refs/heads/codex/search-customer-copy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Repair stale accessible-name locators
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/tests/e2e/dashboard-branding.spec.ts')
          source = path.read_text(encoding='utf-8')
          replacements = (
              ("name: 'AI 빠른 실행'", "name: '판단 보조 빠른 실행'"),
              ("name: 'AI 빠른 실행 메뉴'", "name: '판단 보조 빠른 실행 메뉴'"),
              ("getByRole('link', { name: '맥락 검색' })", "getByRole('link', { name: '맥락 검색', exact: true })"),
          )
          for stale, current in replacements:
              if stale not in source:
                  raise SystemExit(f'expected stale owner locator missing: {stale}')
              source = source.replace(stale, current)
          if "name: 'AI 빠른 실행'" in source or "name: 'AI 빠른 실행 메뉴'" in source:
              raise SystemExit('stale AI quick-action accessible name remains')
          if "getByRole('link', { name: '맥락 검색' })" in source:
              raise SystemExit('non-exact mobile context-search locator remains')
          path.write_text(source, encoding='utf-8')

      - name: Commit ordinary child and remove one-shot workflow
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/temporary-search-e2e-owner-repair.yml
          git add frontend/tests/e2e/dashboard-branding.spec.ts .github/workflows/temporary-search-e2e-owner-repair.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/temporary-search-e2e-owner-repair.yml' 'frontend/tests/e2e/dashboard-branding.spec.ts' | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(search): align dashboard E2E accessible names'
          remote_head="$(git ls-remote origin refs/heads/codex/search-customer-copy | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:codex/search-customer-copy
