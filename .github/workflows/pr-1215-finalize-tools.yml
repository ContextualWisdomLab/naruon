name: PR 1215 finalize utility tools

on:
  pull_request:
    branches:
      - develop
    types: [synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-1215-finalize-utility-tools
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.ref == 'feature/add-utility-tools-11760471479253023845' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: feature/add-utility-tools-11760471479253023845
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install hash-locked backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r backend/requirements-hashes.txt

      - name: Add the buyer-visible changelog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          section = '''### 새로운 유틸리티 도구 (UUID 및 상호운용 해시)

- `uuid_generator`가 UUID v4와 개인정보 보호형 UUID v1을 생성합니다. UUID v1은 서버 MAC 주소를 노출하지 않도록 임의 multicast node를 사용합니다.
- `hash_generator`가 SHA-256·SHA-512와 상호운용 목적의 MD5·SHA-1 digest를 제공합니다. MD5와 SHA-1은 보안 용도가 아님을 API 설명과 구현 경계에 명시하고 안정적인 실패 `error_code`를 반환합니다.

'''
          if section not in text:
              marker = "## [Unreleased]\n"
              if text.count(marker) != 1:
                  raise SystemExit("Unreleased changelog marker not found exactly once")
              text = text.replace(marker, marker + section, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate implementation, contracts, and full backend suite
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m ruff check api/tools.py tests/test_tools_api.py
          python -m ruff format --check api/tools.py tests/test_tools_api.py
          python -m pytest -q tests/test_tools_api.py
          python -m pytest -q

      - name: Commit the verified changelog update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record UUID and hash utility tools"
            git push origin HEAD:feature/add-utility-tools-11760471479253023845
          fi
