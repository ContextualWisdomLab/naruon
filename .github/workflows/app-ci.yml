name: Application CI

on:
  pull_request:
    branches:
      - develop
      - master
      - "release/**"
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt

      - name: Install Noema agent optional dependency
        # Installs pydantic-ai (services/noema_agent.py) so the real build-path
        # test (test_agent_runs_tools_with_test_model) executes instead of being
        # skipped. Keep the core and agent lock files on the same pip command so
        # --require-hashes can validate both preinstalled shared dependencies and
        # agent-only packages.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt \
            -r backend/requirements-agent.txt

      - name: Run backend lint
        run: |
          cd backend
          python -m ruff check .

      - name: Run backend tests
        run: |
          set -o pipefail
          cd backend
          python -m pytest -q 2>&1 | tee pytest_output.log
          if grep -qiE 'timeout|fatal|warn|denied' pytest_output.log; then
            echo "::error::Tests produced Timeout, Fatal, Warn, or Denied outputs"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: cd frontend && pnpm test

      - name: Run frontend lint
        run: cd frontend && pnpm run lint

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        run: |
          rm -f ~/package-lock.json
          cd frontend && pnpm run build

      - name: Install Playwright Chromium
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: Run full product smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NARUON_FULL_PRODUCT_BASE_URL: "http://127.0.0.1:3001"
          NARUON_FULL_PRODUCT_SCREENSHOT_DIR: "/tmp/naruon-full-product-smoke"
        run: cd frontend && pnpm run full:smoke

  resolve_httpx2_candidate:
    name: resolve httpx2 2.13.0 candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1565 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/starlette-testclient-dependency'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_VERSION: "0.10.0"
      HTTPX2_VERSION: "2.13.0"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned resolver
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Resolve coherent core and optional-agent TestClient dependencies without writing repository history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = "httpx2==2.13.0"
          for path in (Path("backend/requirements.txt"), Path("backend/pyproject.toml")):
              text = path.read_text()
              old = "httpx2==2.5.0"
              if text.count(old) != 1:
                  raise SystemExit(f"expected one {old} in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, target))
          PY
          (
            cd backend
            uv lock --upgrade-package "httpx2==${HTTPX2_VERSION}"
            uv lock --check
          )
          uv pip compile \
            --generate-hashes \
            --python-version 3.14 \
            --python-platform x86_64-unknown-linux-gnu \
            --output-file backend/requirements-hashes.txt \
            backend/requirements.txt
          grep -F "httpx2==${HTTPX2_VERSION}" backend/requirements-hashes.txt
          grep -F "httpcore2==2.13.0" backend/requirements-hashes.txt

          python - <<'PY'
          from pathlib import Path

          core_path = Path("backend/requirements-hashes.txt")
          agent_path = Path("backend/requirements-agent.txt")
          core_text = core_path.read_text()
          agent_text = agent_path.read_text()

          def record(text: str, package: str) -> tuple[str, list[str]]:
              lines = text.splitlines()
              start = next(
                  (i for i, line in enumerate(lines) if line.startswith(f"{package}==")),
                  None,
              )
              if start is None:
                  raise SystemExit(f"missing generated core record for {package}")
              pin = lines[start].split(" \\", 1)[0]
              hashes: list[str] = []
              for line in lines[start + 1 :]:
                  stripped = line.strip()
                  if stripped.startswith("--hash=sha256:"):
                      hashes.append(stripped.rstrip(" \\").removeprefix("--hash=sha256:"))
                      continue
                  if stripped.startswith("#"):
                      break
                  if line and not line.startswith((" ", "\t")):
                      break
              if not hashes:
                  raise SystemExit(f"generated core record has no hashes for {package}")
              return pin, hashes

          def replace_record(text: str, package: str, via: str) -> str:
              pin, hashes = record(core_text, package)
              lines = text.splitlines()
              start = next(
                  (i for i, line in enumerate(lines) if line.startswith(f"{package}==")),
                  None,
              )
              if start is None:
                  raise SystemExit(f"missing optional-agent record for {package}")
              end = start + 1
              while end < len(lines):
                  stripped = lines[end].strip()
                  if stripped.startswith("--hash=sha256:") or stripped.startswith("#"):
                      end += 1
                      continue
                  break
              rendered = [f"{pin} \\"]
              for index, digest in enumerate(hashes):
                  suffix = " \\" if index < len(hashes) - 1 else ""
                  rendered.append(f"    --hash=sha256:{digest}{suffix}")
              rendered.append(f"    # via {via}")
              return "\n".join(lines[:start] + rendered + lines[end:]) + "\n"

          agent_text = replace_record(agent_text, "httpcore2", "httpx2")
          agent_text = replace_record(agent_text, "httpx2", "genai-prices")
          if "httpx2==2.5.0" in agent_text or "httpcore2==2.5.0" in agent_text:
              raise SystemExit("stale 2.5.0 TestClient dependency remains in optional-agent lock")
          agent_path.write_text(agent_text)
          PY

          python -m pip install --disable-pip-version-check --dry-run --ignore-installed --require-hashes \
            -r backend/requirements-hashes.txt \
            -r backend/requirements-agent.txt
          grep -F "httpx2==${HTTPX2_VERSION}" backend/requirements-agent.txt
          grep -F "httpcore2==2.13.0" backend/requirements-agent.txt
          git diff --check
          mkdir -p .resolver-evidence
          git diff --binary -- \
            backend/requirements.txt \
            backend/pyproject.toml \
            backend/requirements-hashes.txt \
            backend/requirements-agent.txt \
            backend/uv.lock \
            > .resolver-evidence/generated.diff
          sha256sum \
            backend/requirements.txt \
            backend/pyproject.toml \
            backend/requirements-hashes.txt \
            backend/requirements-agent.txt \
            backend/uv.lock \
            | tee .resolver-evidence/sha256.txt
          cat > .resolver-evidence/upstream.txt <<'EOF'
          candidate=httpx2==2.13.0
          expected_httpcore2=httpcore2==2.13.0
          optional_agent_consumer=genai-prices==0.0.71
          optional_agent_requirement=httpx2>=2.0
          upstream_release=v2.13.0
          upstream_published_at=2026-09-14T14:17:29Z
          EOF

      - name: Upload exact generated resolver evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: httpx2-2.13.0-resolution-${{ github.event.pull_request.head.sha }}
          path: |
            backend/requirements.txt
            backend/pyproject.toml
            backend/requirements-hashes.txt
            backend/requirements-agent.txt
            backend/uv.lock
            .resolver-evidence/generated.diff
            .resolver-evidence/sha256.txt
            .resolver-evidence/upstream.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  adopt_httpx2_candidate:
    name: adopt verified httpx2 2.13.0 graph
    needs: resolve_httpx2_candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1565 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/starlette-testclient-dependency'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      UV_VERSION: "0.10.0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact PR head for ordinary adoption
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Recover and independently verify exact resolver artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          ARTIFACT_NAME="httpx2-2.13.0-resolution-${{ github.event.pull_request.head.sha }}"
          export ARTIFACT_NAME
          artifact_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          read -r ARTIFACT_ID ARTIFACT_DIGEST < <(
            printf '%s' "${artifact_json}" | python -c '
          import json, os, sys
          data = json.load(sys.stdin)
          matches = [a for a in data.get("artifacts", []) if a.get("name") == os.environ["ARTIFACT_NAME"] and not a.get("expired")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one live resolver artifact, found {len(matches)}")
          artifact = matches[0]
          print(artifact["id"], artifact["digest"])
          '
          )
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/httpx2-resolver.zip
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" /tmp/httpx2-resolver.zip | sha256sum -c -
          rm -rf /tmp/httpx2-resolver
          mkdir -p /tmp/httpx2-resolver
          unzip -q /tmp/httpx2-resolver.zip -d /tmp/httpx2-resolver
          (
            cd /tmp/httpx2-resolver
            sha256sum -c .resolver-evidence/sha256.txt
          )
          cat > /tmp/httpx2-expected.sha256 <<'EOF'
          87f603d06eb05fa234163003a2feda98f024b80751cc9eb919aedb261136482f  backend/requirements.txt
          faab5edd236153c28a321e431dc1a6d5f99bcaa64f26f21c60222a1db2057365  backend/pyproject.toml
          551f6aa4a6a8f1efb7f6259dc63777c40c09b2f520dea217575b94b12178f7d5  backend/requirements-hashes.txt
          761ceb9f7042ffa9538c5a596ad113a3ee59f27381c4a44d34df82338e5b913a  backend/requirements-agent.txt
          fa28138f637a2c2baddd528893cfb04be2d9064afcadd538fb7fa5000be7f82b  backend/uv.lock
          EOF
          (
            cd /tmp/httpx2-resolver
            sha256sum -c /tmp/httpx2-expected.sha256
            grep -Fx 'candidate=httpx2==2.13.0' .resolver-evidence/upstream.txt
            grep -Fx 'expected_httpcore2=httpcore2==2.13.0' .resolver-evidence/upstream.txt
            grep -Fx 'optional_agent_consumer=genai-prices==0.0.71' .resolver-evidence/upstream.txt
            grep -Fx 'optional_agent_requirement=httpx2>=2.0' .resolver-evidence/upstream.txt
            ! grep -R -n -E 'httpx2==2\.5\.0|httpcore2==2\.5\.0' \
              backend/requirements.txt backend/pyproject.toml backend/requirements-hashes.txt \
              backend/requirements-agent.txt backend/uv.lock
          )

      - name: Adopt generated graph and update owner contracts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/httpx2-resolver/backend/requirements.txt backend/requirements.txt
          cp /tmp/httpx2-resolver/backend/pyproject.toml backend/pyproject.toml
          cp /tmp/httpx2-resolver/backend/requirements-hashes.txt backend/requirements-hashes.txt
          cp /tmp/httpx2-resolver/backend/requirements-agent.txt backend/requirements-agent.txt
          cp /tmp/httpx2-resolver/backend/uv.lock backend/uv.lock

          python - <<'PY'
          from pathlib import Path

          test_path = Path("backend/tests/test_container_dependency_pin_contract.py")
          test_text = test_path.read_text()
          old_records = '''    backend_records = hashed_requirement_records(\n        read_repo_text("backend/requirements-hashes.txt")\n    )\n    strix_pins = exact_requirement_pins(read_repo_text("requirements-strix-ci.txt"))\n'''
          new_records = '''    backend_records = hashed_requirement_records(\n        read_repo_text("backend/requirements-hashes.txt")\n    )\n    agent_records = hashed_requirement_records(\n        read_repo_text("backend/requirements-agent.txt")\n    )\n    strix_pins = exact_requirement_pins(read_repo_text("requirements-strix-ci.txt"))\n'''
          if test_text.count(old_records) != 1:
              raise SystemExit("unexpected backend lock-record test structure")
          test_text = test_text.replace(old_records, new_records)
          test_text = test_text.replace(
              'assert backend_pins["httpx2"] == "2.5.0"',
              'assert backend_pins["httpx2"] == "2.13.0"',
          )
          test_text = test_text.replace('"httpx2==2.5.0"', '"httpx2==2.13.0"')
          old_anchor = '''    assert "protobuf==7.35.1" in backend_records\n    assert all(\n'''
          new_anchor = '''    assert "protobuf==7.35.1" in backend_records\n    assert "httpcore2==2.13.0" in backend_records\n    assert agent_records["httpx2==2.13.0"] == backend_records["httpx2==2.13.0"]\n    assert agent_records["httpcore2==2.13.0"] == backend_records["httpcore2==2.13.0"]\n    assert all(\n'''
          if test_text.count(old_anchor) != 1:
              raise SystemExit("unexpected backend pin assertion structure")
          test_text = test_text.replace(old_anchor, new_anchor)
          tuple_anchor = '''            "httpx2==2.13.0",\n            "protobuf==7.35.1",\n'''
          tuple_replacement = '''            "httpx2==2.13.0",\n            "httpcore2==2.13.0",\n            "protobuf==7.35.1",\n'''
          if test_text.count(tuple_anchor) != 1:
              raise SystemExit("unexpected backend digest tuple structure")
          test_path.write_text(test_text.replace(tuple_anchor, tuple_replacement))

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          old_line = "- Starlette `TestClient`의 기존 `httpx2==2.5.0` pin을 core 개발·테스트 의존성으로 승격하고, deprecated `httpx` fallback 경고 억제를 제거했습니다."
          new_line = "- Starlette `TestClient`의 preferred transport를 `httpx2==2.13.0` / `httpcore2==2.13.0`으로 고정하고 core와 Noema-agent hash lock을 동일한 의존성 그래프로 동기화했습니다. deprecated `httpx` fallback 경고 억제도 제거해 transport 회귀가 warnings-as-errors 테스트에서 드러나도록 했습니다."
          if changelog.count(old_line) != 1:
              raise SystemExit("unexpected CHANGELOG TestClient entry")
          changelog_path.write_text(changelog.replace(old_line, new_line))
          PY

          cat > docs/doctoring/starlette-httpx2-testclient-dependency.md <<'EOF'
          # Starlette TestClient `httpx2` dependency

          ## Observed failure

          Protected `develop@042b0c70531b229af3acbd0421a2f23098d848b3` pins Starlette
          1.3.1 but did not install Starlette's preferred `httpx2` TestClient transport.
          Importing `starlette.testclient` therefore fell back to deprecated `httpx`, and
          warnings-as-errors runs stopped during collection. Removing the warning filter
          without installing the preferred transport would expose the defect without
          repairing it.

          ## Decision and dependency boundary

          Pin `httpx2==2.13.0` and resolved `httpcore2==2.13.0` in the repository's
          core development/test graph. The Noema-agent lock participates in the same
          `pip --require-hashes` transaction as the core lock, so it carries the exact
          same `httpx2`/`httpcore2` records and hash sets instead of retaining the old
          2.5.0 graph. `genai-prices==0.0.71` requires `httpx2>=2.0`, so this coherent
          pin stays within its declared consumer contract.

          The generated `uv.lock` also records the 2.13.0 platform split: `httpcore2`
          on non-Emscripten platforms and `httpx2-jsfetch==1.0` on Emscripten. Naruon's
          application HTTP clients remain on their existing `httpx` path; this change is
          the Starlette TestClient transport boundary, not an application-client rewrite.

          The accepted five-file candidate was generated read-only with Python 3.14 and
          `uv==0.10.0`, then checked as one core+agent hash-locked dry-run. Artifact
          `10748790356` from Application CI `35844541085` has archive digest
          `sha256:5355320323967e3cd58bdd8f05d1914c63d68790f28bf28b47bfba7fe019942b`.
          Its independently verified file digests are:

          - `requirements.txt`: `87f603d06eb05fa234163003a2feda98f024b80751cc9eb919aedb261136482f`;
          - `pyproject.toml`: `faab5edd236153c28a321e431dc1a6d5f99bcaa64f26f21c60222a1db2057365`;
          - `requirements-hashes.txt`: `551f6aa4a6a8f1efb7f6259dc63777c40c09b2f520dea217575b94b12178f7d5`;
          - `requirements-agent.txt`: `761ceb9f7042ffa9538c5a596ad113a3ee59f27381c4a44d34df82338e5b913a`;
          - `uv.lock`: `fa28138f637a2c2baddd528893cfb04be2d9064afcadd538fb7fa5000be7f82b`.

          These digests establish the adopted bytes; they do not transfer merge or
          release authority. The temporary resolver/adoption workflow is removed from
          the adopted candidate before ordinary exact-head CI is evaluated.

          ## Verification and rollback

          Run from the repository root:

          ```bash
          cd backend && uv lock --check
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt -r backend/requirements-agent.txt
          cd backend && python -m pytest -q -W error tests/test_container_dependency_pin_contract.py
          cd backend && python -m ruff check tests/test_container_dependency_pin_contract.py
          ```

          The structural regression verifies the direct 2.13.0 pin, the core hash-lock
          records, exact core/agent hash equality for `httpx2` and `httpcore2`, and the
          runtime module selected by `starlette.testclient`. Full acceptance still
          requires the normal helper-free current-head Application CI, Security, CodeQL,
          required workflows and qualifying independent review.

          Rollback removes the direct pin, both coherent lock records, runtime assertion,
          and obsolete-warning-filter removal together. Do not restore only the warning
          suppression or leave the core and optional-agent locks on different graphs.

          ## References

          Kludex. (2026). *Starlette release notes*. GitHub.
          https://github.com/Kludex/starlette/blob/main/docs/release-notes.md

          Python Packaging Authority. (2026). *httpx2 2.13.0 file details and provenance*.
          PyPI. https://pypi.org/project/httpx2/2.13.0/

          Pydantic. (2026). *HTTPX2 v2.13.0* [Source code]. GitHub.
          https://github.com/pydantic/httpx2/tree/v2.13.0
          EOF
          sed -i 's/^          //' docs/doctoring/starlette-httpx2-testclient-dependency.md

          # Remove the temporary resolver/adopter from the candidate itself.
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/app-ci.yml" > .github/workflows/app-ci.yml
          git diff --check

      - name: Verify helper-free coherent candidate locally
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          (
            cd backend
            uv lock --check
          )
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt \
            -r backend/requirements-agent.txt
          (
            cd backend
            python -m pytest -q -W error tests/test_container_dependency_pin_contract.py
            python -m ruff check tests/test_container_dependency_pin_contract.py
          )
          ! grep -R -n -E 'httpx2==2\.5\.0|httpcore2==2\.5\.0' \
            backend/requirements.txt backend/pyproject.toml backend/requirements-hashes.txt \
            backend/requirements-agent.txt backend/uv.lock

          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/app-ci.yml
          CHANGELOG.md
          backend/pyproject.toml
          backend/requirements-agent.txt
          backend/requirements-hashes.txt
          backend/requirements.txt
          backend/tests/test_container_dependency_pin_contract.py
          backend/uv.lock
          docs/doctoring/starlette-httpx2-testclient-dependency.md
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          git diff --name-only | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Ordinary non-force adoption push
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref }}"
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/${branch}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/app-ci.yml \
            CHANGELOG.md \
            backend/pyproject.toml \
            backend/requirements-agent.txt \
            backend/requirements-hashes.txt \
            backend/requirements.txt \
            backend/tests/test_container_dependency_pin_contract.py \
            backend/uv.lock \
            docs/doctoring/starlette-httpx2-testclient-dependency.md
          git diff --cached --check
          git commit -m "fix(test): adopt coherent httpx2 2.13.0 dependency graph"
          git push origin "HEAD:refs/heads/${branch}"
