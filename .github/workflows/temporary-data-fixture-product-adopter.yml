name: Temporary Data fixture product adopter

on:
  push:
    branches:
      - fix/stacked-pr-trigger-foundation

permissions:
  contents: write

jobs:
  adopt:
    name: Adopt shared Playwright Data evidence fixture
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Apply bounded fixture repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper_path = Path("frontend/tests/e2e/helpers.ts")
          test_path = Path("frontend/src/lib/data-evidence-snapshot-e2e-fixture.test.ts")
          helper = helper_path.read_text(encoding="utf-8")

          if "const dataEvidenceSnapshot =" in helper:
              raise SystemExit("dataEvidenceSnapshot fixture already exists; refusing ambiguous rewrite")
          if "/api/data/quality-surface/evidence-snapshot" in helper:
              raise SystemExit("evidence-snapshot route already exists; refusing ambiguous rewrite")
          if test_path.exists():
              raise SystemExit(f"{test_path} already exists; refusing overwrite")

          fixture_anchor = "\nconst accountConfig = {\n"
          if helper.count(fixture_anchor) != 1:
              raise SystemExit("accountConfig insertion anchor is not unique")

          fixture = r'''
          const dataEvidenceSnapshot = {
            snapshot_version: 'data_quality_evidence_snapshot.v1',
            generated_at: '2026-05-28T05:47:00Z',
            audit_event: 'data.quality_surface.evidence_snapshot.viewed',
            scope_label: 'playwright_dashboard_fixture',
            snapshot_digest: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef',
            digest_algorithm: 'sha256',
            canonical_payload_fields: [],
            privacy_redaction_policy: {
              raw_content_exposed: false,
              stable_identifiers_exposed: false,
              provider_credentials_exposed: false,
              redacted_fields: [],
              allowed_sample_fields: [],
            },
            validation_status: {
              status_code: 'ready',
              display_name: 'Ready',
              detail_text: 'Playwright evidence snapshot is redacted and verifier-ready.',
              provider_write_executed: false,
            },
            verification_handoff: {
              handoff_text: 'Verify the copied Playwright snapshot JSON before sharing diligence materials.',
              verifier_command: 'python scripts/verify_evidence_snapshot.py snapshot.json',
              accepted_input: 'data_quality_evidence_snapshot.v1 JSON',
              digest_algorithm: 'sha256',
              excluded_digest_fields: ['snapshot_digest'],
              success_exit_code: 0,
              failure_exit_codes: { invalid_digest: 2 },
              provider_write_executed: false,
            },
            parser_manifest_summary: [],
            content_graph_evidence_samples: [],
            knowledge_graph_evidence_samples: [],
            evidence_packet_checklist: [],
            data_room_package_manifest: [],
            diligence_exception_register: [],
            diligence_risk_matrix: [],
            diligence_close_artifact_review_queue: [],
            diligence_close_owner_handoff_queue: [],
            diligence_close_traceability_map: [],
            diligence_close_decision_summary: null,
            diligence_close_proof_plan: [],
          };
          '''
          helper = helper.replace(fixture_anchor, "\n" + fixture.strip() + "\n" + fixture_anchor, 1)

          route_anchor = """    if (path === '/api/data/quality-surface' && request.method() === 'GET') {\n      await fulfillJson(route, dataQualitySurface);\n      return;\n    }\n\n"""
          if helper.count(route_anchor) != 1:
              raise SystemExit("data quality route insertion anchor is not unique")

          evidence_route = """    if (path === '/api/data/quality-surface/evidence-snapshot' && request.method() === 'GET') {\n      await fulfillJson(route, dataEvidenceSnapshot);\n      return;\n    }\n\n"""
          helper = helper.replace(route_anchor, route_anchor + evidence_route, 1)
          helper_path.write_text(helper, encoding="utf-8")

          test_path.write_text(
              """import type { Page, Route } from '@playwright/test';\nimport { describe, expect, it, vi } from 'vitest';\n\nimport { mockDashboardApi } from '../../tests/e2e/helpers';\n\ntype RouteHandler = (route: Route) => Promise<void>;\n\ndescribe('mockDashboardApi Data evidence snapshot', () => {\n  it('serves a redacted verifier-ready snapshot instead of falling through to 404', async () => {\n    let routeHandler: RouteHandler | undefined;\n    const page = {\n      route: vi.fn(async (_pattern: string, handler: RouteHandler) => {\n        routeHandler = handler;\n      }),\n    } as unknown as Page;\n\n    await mockDashboardApi(page);\n    expect(routeHandler).toBeDefined();\n\n    const fulfill = vi.fn(async () => undefined);\n    const route = {\n      request: () => ({\n        url: () => 'https://naruon.test/api/data/quality-surface/evidence-snapshot',\n        method: () => 'GET',\n      }),\n      fulfill,\n    } as unknown as Route;\n\n    await routeHandler!(route);\n\n    expect(fulfill).toHaveBeenCalledTimes(1);\n    const response = fulfill.mock.calls[0]?.[0] as {\n      status?: number;\n      contentType?: string;\n      body?: string;\n    };\n    expect(response.status).toBe(200);\n    expect(response.contentType).toBe('application/json');\n\n    const body = JSON.parse(response.body ?? '{}') as Record<string, unknown>;\n    expect(body.snapshot_version).toBe('data_quality_evidence_snapshot.v1');\n    expect(body.digest_algorithm).toBe('sha256');\n    expect(body.snapshot_digest).toMatch(/^[0-9a-f]{64}$/u);\n    expect(body.privacy_redaction_policy).toMatchObject({\n      raw_content_exposed: false,\n      stable_identifiers_exposed: false,\n      provider_credentials_exposed: false,\n    });\n    expect(body.validation_status).toMatchObject({ status_code: 'ready' });\n    expect(body.verification_handoff).toMatchObject({\n      accepted_input: 'data_quality_evidence_snapshot.v1 JSON',\n      digest_algorithm: 'sha256',\n      success_exit_code: 0,\n    });\n  });\n});\n""",
              encoding="utf-8",
          )
          PY

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Prove focused repair
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec vitest run src/lib/data-evidence-snapshot-e2e-fixture.test.ts
          pnpm exec eslint tests/e2e/helpers.ts src/lib/data-evidence-snapshot-e2e-fixture.test.ts --max-warnings 0

      - name: Commit and push product delta non-force
        shell: bash
        env:
          BRANCH_NAME: fix/stacked-pr-trigger-foundation
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${expected}" ]]; then
            echo "Remote head moved: expected ${expected}, got ${remote_head}" >&2
            exit 1
          fi

          git add -- frontend/tests/e2e/helpers.ts frontend/src/lib/data-evidence-snapshot-e2e-fixture.test.ts
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          frontend/src/lib/data-evidence-snapshot-e2e-fixture.test.ts
          frontend/tests/e2e/helpers.ts
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ci): cover Data evidence snapshot fixture"
          git push origin "HEAD:${BRANCH_NAME}"
