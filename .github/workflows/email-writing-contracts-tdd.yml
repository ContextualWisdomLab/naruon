name: Email Writing Contracts TDD

on:
  push:
    branches:
      - feat/llm-email-writing-contracts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-writing-contracts-tdd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt
      - run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt
      - name: Run strict backend contract tests
        run: |
          cd backend
          python -m pytest -q tests/test_email_writing_contracts.py
      - name: Verify backend contract coverage
        run: |
          cd backend
          python -m coverage erase
          python -m coverage run --branch --include='services/email_writing_contracts.py' -m pytest -q tests/test_email_writing_contracts.py
          python -m coverage report --show-missing --fail-under=100 services/email_writing_contracts.py
      - name: Lint backend contract implementation
        run: |
          cd backend
          python -m ruff check services/email_writing_contracts.py tests/test_email_writing_contracts.py

  frontend-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: Run strict frontend contract tests
        run: cd frontend && pnpm exec vitest run src/lib/email-writing.test.ts
      - name: Verify frontend contract coverage
        run: >-
          cd frontend && pnpm exec vitest run src/lib/email-writing.test.ts
          --coverage
          --coverage.include=src/lib/email-writing.ts
          --coverage.reporter=text
          --coverage.thresholds.statements=100
          --coverage.thresholds.branches=100
          --coverage.thresholds.functions=100
          --coverage.thresholds.lines=100
      - name: Typecheck frontend contract implementation
        run: cd frontend && pnpm typecheck
