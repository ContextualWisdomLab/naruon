version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-python:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-python:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-config-next의 플러그인들이 아직 ESLint 10을 지원하지 않는다.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # @typescript-eslint/typescript-estree 8.63은 TypeScript <6.1만 지원한다.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-npm:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /connector
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /connector
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
